<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Marmite Planning">

<title>La Marmite Bleue – Planning</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#F1F5F9;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
.hdr{background:linear-gradient(135deg,#0EA5E9,#0369A1);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav{background:#fff;border-bottom:1px solid #E2E8F0;display:flex;flex-shrink:0;overflow-x:auto}
.nav-btn{flex-shrink:0;padding:9px 8px;border:none;background:none;font-size:10px;font-weight:400;color:#94A3B8;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px}
.nav-btn .ico{font-size:16px}
.nav-btn.active{font-weight:700;color:#0EA5E9;border-bottom-color:#0EA5E9}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;-webkit-overflow-scrolling:touch}
.btn-pri{background:linear-gradient(135deg,#0EA5E9,#0284C7);color:#fff;border:none;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(14,165,233,.3)}
.btn-sec{background:#fff;border:1px solid #E2E8F0;padding:7px 11px;border-radius:8px;font-size:12px;color:#374151;font-weight:500}
.pills{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.pill{flex-shrink:0;padding:6px 10px 5px;border-radius:9px;border:1px solid #E2E8F0;background:#fff;color:#374151;min-width:50px;text-align:center;font-size:11px}
.pill.active{background:#0EA5E9;color:#fff;font-weight:700;border-color:#0EA5E9;box-shadow:0 2px 8px rgba(14,165,233,.35)}
.pill.we{color:#DC2626}
.card{background:#fff;border-radius:10px;border:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.fc-bar{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #E2E8F0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fc-lbl{display:flex;align-items:center;gap:5px;font-size:11px;color:#64748B;font-weight:600}
.fc-inp{width:72px;padding:4px 6px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px;text-align:center;outline:none}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.hint{display:flex;gap:6px;padding:6px 10px;background:#F0F9FF;border:1px solid #BAE6FD;border-radius:8px;font-size:11px;color:#0369A1;line-height:1.5}
.tl-outer{background:#fff;border-radius:10px;border:1px solid #E2E8F0;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.sec-hdr{display:flex;border-top:1px solid;border-bottom:1px solid}
.sec-lbl{flex-shrink:0;padding:3px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;position:sticky;left:0;z-index:5;border-right:1px solid;display:flex;align-items:center;gap:5px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:999}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.modal-hdr{background:linear-gradient(135deg,#0EA5E9,#0284C7);color:#fff;padding:13px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:1;border-radius:20px 20px 0 0}
.modal-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:10px 14px;border-top:1px solid #F1F5F9;display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.fld-lbl{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px}
.fld-inp{width:100%;padding:9px 11px;border:1px solid #E2E8F0;border-radius:9px;font-size:14px;color:#0F172A;outline:none}
.h-btn{padding:7px 12px;border-radius:7px;border:2px solid #E2E8F0;background:#fff;color:#374151;font-size:13px}
.h-btn.sel{border-color:#0EA5E9;background:#EFF6FF;color:#0369A1;font-weight:700}
#loading{position:fixed;inset:0;background:#F1F5F9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:8888}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:34px;height:34px;border:4px solid #E2E8F0;border-top-color:#0EA5E9;border-radius:50%;animation:spin .8s linear infinite}
.row{display:flex;align-items:center}
@media print{
  body{overflow:visible!important;height:auto!important}
  #app,#loading{display:none!important}
  #print-area{display:block!important}
  .print-page{page-break-after:always;padding:12mm;font-family:Arial,sans-serif}
  .print-page:last-child{page-break-after:avoid}
}
::-webkit-scrollbar{height:6px;width:5px}
::-webkit-scrollbar-track{background:#F1F5F9}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
/* ── RH MODULE ── */
.rh-tabs{display:flex;border-bottom:2px solid #E2E8F0;margin-bottom:14px;gap:0}
.rh-tab{flex:1;padding:10px 4px;text-align:center;font-size:12px;font-weight:600;color:#94A3B8;border:none;background:none;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-2px}
.rh-tab.active{color:#0EA5E9;border-bottom-color:#0EA5E9}
.rh-section{display:flex;flex-direction:column;gap:10px}
.rh-card{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:14px}
.rh-card-title{font-size:11px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-row.full{grid-template-columns:1fr}
.dispo-grid{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;align-items:center}
.dispo-day{font-size:11px;font-weight:700;color:#374151;padding-right:6px}
.dispo-slot{display:flex;align-items:center;justify-content:center;padding:7px 4px;border-radius:8px;border:2px solid #E2E8F0;background:#F8FAFC;cursor:pointer;font-size:10px;font-weight:700;color:#94A3B8;text-align:center;transition:all .15s;user-select:none}
.dispo-slot.on{border-color:#22C55E;background:#F0FDF4;color:#15803D}
.dispo-slot.off{border-color:#FCA5A5;background:#FFF1F2;color:#BE123C}
.contract-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.emp-detail-header{background:linear-gradient(135deg,#0EA5E9,#0369A1);color:#fff;padding:16px;display:flex;align-items:center;gap:12px;border-radius:20px 20px 0 0}
.emp-avatar-lg{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.tag-select{width:100%;padding:9px 11px;border:1px solid #E2E8F0;border-radius:9px;font-size:13px;color:#0F172A;outline:none;background:#fff}
.alert-chr{display:flex;gap:8px;padding:8px 12px;border-radius:8px;font-size:12px;line-height:1.4}
.alert-chr.warn{background:#FFFBEB;border:1px solid #FCD34D;color:#92400E}
.alert-chr.ok{background:#F0FDF4;border:1px solid #86EFAC;color:#14532D}
.alert-chr.info{background:#F0F9FF;border:1px solid #BAE6FD;color:#0369A1}
</style>

<div id="login" style="display:none;position:fixed;inset:0;background:linear-gradient(135deg,#0EA5E9,#0369A1);z-index:9000;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:16px;padding:22px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.25)">
    <div style="text-align:center;font-size:36px">🫙</div>
    <div style="text-align:center;font-weight:800;font-size:17px;color:#0F172A">La Marmite Bleue</div>
    <div style="text-align:center;font-size:11px;color:#64748B;margin-bottom:16px">🔒 Accès gérant — Planning &amp; RH</div>

    <input class="fld-inp" id="lg-email" type="email" autocomplete="username" style="margin-bottom:10px">

    <input class="fld-inp" id="lg-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">

</div>

<div id="app">
  <div class="hdr">
    <div style="width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0">🫙</div>
    <div style="flex:1">

</div>

function getPostes(){return(S.postesConfig&&S.postesConfig.length)?S.postesConfig:DEFAULT_POSTES;}
function getPS(){
  const out={};
  getPostes().forEach(p=>{const c=COLOR_PALETTE.find(x=>x.key===p.color)||COLOR_PALETTE[0];out[p.id]={bg:c.bg,bd:c.bd,tx:c.tx,dot:c.dot};});
  return out;
}

// ═══════════════════════════════════
// CONSTANTES TIMELINE
// ═══════════════════════════════════
const PX=2,TL_S=6*60,TL_E=24*60,SNAP=15,MIN_D=120;
const TL_W=(TL_E-TL_S)*PX,EC_W=130,BH=46,BG=6;

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let S={
  emps:[],templates:{},fc:{},plan:{},
  par:{ratioMoule:80,ratioFrite:100,ratioSalle:80,seuilBar:1500,seuilPlo:50,ticketMoyen:25},
  postesConfig:[...DEFAULT_POSTES]
};
let MON=monday(new Date()),SEL=iso(new Date()),curTab='planning';
let saveT=null,DRAG=null,_unsub=null,_unsubEmps=null,_unsubTemplates=null,_rhEmpTab='identite';
let _unsubPriv=null,_pubRaw={},_priv={},_pubLoaded=false,_privLoaded=false,_migrated={},_started=false;

// ═══════════════════════════════════
// UTILS
// ═══════════════════════════════════
function monday(d){const r=new Date(d);r.setHours(0,0,0,0);r.setDate(r.getDate()-((r.getDay()||7)-1));return r;}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function p2(n){return String(n).padStart(2,'0');}
function days(){return Array.from({length:7},(_,i)=>addD(MON,i));}
function fDay(d){return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'});}
function fWk(m){const e=addD(m,6);return m.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' – '+e.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}
function isWE(d){const w=d.getDay();return w===0||w===6;}
function uid(){return Math.random().toString(36).slice(2,9);}
function m2px(m){return(m-TL_S)*PX;}
function px2m(px){return px/PX+TL_S;}
function snap(m){return Math.round(m/SNAP)*SNAP;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fT(m){const h=Math.floor(m/60)%24,mm=m%60;return h+'h'+(mm?p2(mm):'');}
function fDur(m){const h=Math.floor(m/60),mm=m%60;return h?(mm?h+'h'+p2(mm):h+'h'):mm+'min';}
function fNum(n){return (+n).toLocaleString('fr-FR');}

// ═══════════════════════════════════
// HELPERS PLANNING
// ═══════════════════════════════════
function mainP(e){return(e.postes||[])[0]||getPostes()[0].id;}
function shifts(dk,eid){
  const v=(S.plan[dk]||{})[eid];
  if(!v)return[];
  return Array.isArray(v)?v:(v.s!=null?[v]:[]);
}
function setShifts(dk,eid,arr){
  if(!S.plan[dk])S.plan[dk]={};
  S.plan[dk][eid]=arr.filter(s=>s&&s.s!=null);
  autoSave();
}
function rowH(n){return 10+Math.max(1,n)*(BH+BG)-BG;}
function bTop(i){return 5+i*(BH+BG);}
function dayMin(dk,eid){return shifts(dk,eid).reduce((s,sh)=>s+sh.e-sh.s,0);}
function wkH(eid){return days().reduce((s,d)=>s+dayMin(iso(d),eid),0)/60;}

// ═══════════════════════════════════
// PRÉVISIONS
// ═══════════════════════════════════
function getTrans(f){
  const ca=+(f.ca)||0,tm=+(f.ticketMoyen)||+(S.par.ticketMoyen)||25;
  return ca&&tm?Math.round(ca/tm):0;
}
function calcNeeds(f){
  const t=getTrans(f),ca=+(f.ca)||0,p=S.par;
  if(!t&&!ca)return Object.fromEntries(getPostes().map(x=>[x.id,0]));
  return{
    Moule:    Math.max(1,Math.ceil(t/(p.ratioMoule||80))),
    Frite:    Math.max(1,Math.ceil(t/(p.ratioFrite||100))),
    Bar:      ca>=(p.seuilBar||1500)?1:0,
    Plonge:   t>=(p.seuilPlo||50)?1:0,
    Sauce:    Math.max(1,Math.ceil(t/(p.ratioFrite||100))),
    Livraison:0,
    Salle:    Math.max(1,Math.ceil(t/(p.ratioSalle||80))),
    Dessert:  t>0?1:0,
  };
}
function prodBadge(dk){
  const f=S.fc[dk]||{},ca=+(f.ca)||0;
  if(!ca)return'';
  const totalMin=S.emps.reduce((s,e)=>s+shifts(dk,e.id).reduce((ss,sh)=>ss+(sh.e-sh.s),0),0);
  const h=totalMin/60;
  if(h<=0)return`<div style="padding:5px 10px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;font-size:11px;color:#92400E">📈 Planifiez des créneaux pour voir la productivité</div>`;
  const eph=Math.round(ca/h),ne=S.emps.filter(e=>shifts(dk,e.id).length>0).length,epe=ne?Math.round(ca/ne):0;
  const col=eph>=250?'#16A34A':eph>=150?'#D97706':'#DC2626';
  const bg=eph>=250?'#F0FDF4':eph>=150?'#FFFBEB':'#FFF1F2';
  const bd=eph>=250?'#86EFAC':eph>=150?'#FDE68A':'#FECDD3';
  return`<div id="prod-badge" style="padding:5px 12px;background:${bg};border:1px solid ${bd};border-radius:9px;font-size:12px;color:${col};font-weight:700;white-space:nowrap">
    📈 ${fNum(eph)} €/h &nbsp;·&nbsp; <span style="font-size:11px;font-weight:500">${h.toFixed(1)}h planifiées</span> &nbsp;·&nbsp; <span style="font-size:11px;font-weight:500">${fNum(epe)} €/équipier</span>
  </div>`;
}
function weekRecap(){
  const ds=days(),maxCA=Math.max(...ds.map(d=>+(S.fc[iso(d)]||{}).ca||0),1);
  const totalCA=ds.reduce((s,d)=>s+(+(S.fc[iso(d)]||{}).ca||0),0);
  const totalT=ds.reduce((s,d)=>s+getTrans(S.fc[iso(d)]||{}),0);
  const bars=ds.map(d=>{
    const dk=iso(d),f=S.fc[dk]||{},ca=+(f.ca)||0,t=getTrans(f),sel=dk===SEL,we=isWE(d);
    const barH=ca?Math.max(4,Math.round((ca/maxCA)*28)):0;
    return`<div onclick="selDay('${dk}')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 2px;border-radius:7px;background:${sel?'#EFF6FF':'transparent'};border:1px solid ${sel?'#BFDBFE':'transparent'}">
      <div style="font-size:9px;font-weight:${sel?700:500};color:${we?'#DC2626':sel?'#1E40AF':'#64748B'};text-transform:capitalize;white-space:nowrap">${fDay(d)}</div>
      <div style="width:100%;height:30px;display:flex;align-items:flex-end;justify-content:center">
        <div style="width:68%;border-radius:3px 3px 0 0;height:${barH||2}px;background:${barH?sel?'#3B82F6':we?'#FCA5A5':'#93C5FD':'#F1F5F9'};transition:height .25s"></div>
      </div>
      <div style="font-size:10px;font-weight:700;color:${ca?sel?'#1E40AF':'#374151':'#CBD5E1'}">${ca?fNum(ca)+'€':'—'}</div>
      <div style="font-size:9px;color:${sel?'#3B82F6':'#94A3B8'};min-height:12px">${t?t+'t':''}</div>
    </div>`;
  }).join('');
  return`<div id="wk-recap" class="card" style="padding:10px 12px;margin-bottom:8px">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:8px">
      <span style="font-size:11px;font-weight:700;color:#374151">📅 Récap CA semaine</span>
      <div class="row" style="gap:10px">
        ${totalCA?`<span style="font-size:13px;font-weight:800;color:#0369A1">Total : ${fNum(totalCA)} €</span>`:''}
        ${totalT?`<span style="font-size:11px;color:#64748B;font-weight:600">${fNum(totalT)} transactions</span>`:''}
      </div>
    </div>
    <div style="display:flex;gap:3px;align-items:flex-end">${bars}</div>
  </div>`;
}
function needsBadges(dk){
  const needs=calcNeeds(S.fc[dk]||{}),PS_=getPS();
  const html=getPostes().filter(p=>needs[p.id]>0).map(p=>{
    const ps=PS_[p.id]||{},a=S.emps.filter(e=>shifts(dk,e.id).some(sh=>(sh.poste||mainP(e))===p.id)).length;
    const ok=a>=needs[p.id];

    </span>`;
  }).join('');
  return html||'<span style="font-size:11px;color:#CBD5E1">Saisir CA + ticket moyen</span>';
}

function authErr(e){
  const c=e.code||'';
  if(c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found'))return'Email ou mot de passe incorrect.';
  if(c.includes('too-many-requests'))return'Trop de tentatives, réessayez dans quelques minutes.';
  if(c.includes('email-already-in-use'))return'Ce compte existe déjà : connectez-vous (ou « Mot de passe oublié »).';
  if(c.includes('weak-password'))return'Mot de passe trop court (8 caractères minimum conseillés).';
  if(c.includes('operation-not-allowed'))return'Activez « Email/Mot de passe » dans Firebase › Authentication.';
  if(c.includes('network'))return'Pas de connexion internet.';
  return e.message;
}
function doLogin(){

  },e=>{console.error('Private listener:',e);if(e.code==='permission-denied')alert('🔒 Accès aux données sensibles refusé. Vérifiez les règles Firestore (collection employees-private).');});

// Déplace une seule fois les champs sensibles encore présents dans 'employees' vers 'employees-private'
function migratePrivate(){
  if(!_pubLoaded||!_privLoaded)return;
  Object.entries(_pubRaw).forEach(([id,data])=>{
    if(_migrated[id])return;
    const found=PRIV_FIELDS.filter(f=>data[f]!==undefined);
    if(!found.length)return;
    _migrated[id]=true;
    const toPriv={},toDel={},pv=_priv[id]||{};
    found.forEach(f=>{if(pv[f]==null||pv[f]==='')toPriv[f]=data[f];toDel[f]=firebase.firestore.FieldValue.delete();});
    PRIVREF.doc(id).set(toPriv,{merge:true})
      .then(()=>db.collection('employees').doc(id).update(toDel))
      .catch(e=>{console.error('Migration '+id,e);_migrated[id]=false;});
  });
}
function rebuildEmps(){
      S.emps=Object.entries(_pubRaw).sort((a,b)=>(a[1].name||'').localeCompare(b[1].name||'')).map(([docId,pub])=>{

// AUTO-GEN
// ═══════════════════════════════════
const AUTO_SL=[{s:11*60+30,e:17*60+30},{s:17*60,e:23*60},{s:11*60+30,e:23*60},{s:12*60,e:18*60},{s:18*60,e:22*60},{s:14*60,e:20*60}];
function autoGen(){
  const ds=days(),np={};
  ds.forEach(d=>{np[iso(d)]={};});
  const worked=Object.fromEntries(S.emps.map(e=>[e.id,0]));
  const target=Object.fromEntries(S.emps.map(e=>[e.id,Math.max(1,Math.round(e.heures/6))]));
  const ranked=[...ds].sort((a,b)=>getTrans(S.fc[iso(b)]||{})-getTrans(S.fc[iso(a)]||{}));
  for(const day of ranked){
    const dk=iso(day);let si=0;
    getPostes().forEach(p=>{
      const need=(calcNeeds(S.fc[dk]||{}))[p.id];if(!need)return;
      const cands=S.emps.filter(e=>(e.postes||[]).includes(p.id)&&!absOn(e.id,dk)&&inContract(e,dk)&&dayAvail(e,dk)&&!np[dk][e.id]?.length&&worked[e.id]<target[e.id])
        .sort((a,b)=>(target[b.id]-worked[b.id])-(target[a.id]-worked[a.id]));
      let n=0;for(const emp of cands){if(n>=need)break;const sl=AUTO_SL[si%AUTO_SL.length];np[dk][emp.id]=[{s:sl.s,e:sl.e,poste:p.id}];worked[emp.id]++;n++;si++;}
    });
  }
  ds.forEach(d=>{S.plan[iso(d)]=np[iso(d)];});
  autoSave();renderPlanning();
}

function addShift(eid,dk){
  if(!absGuard(eid,dk))return;

  if(ex.length){const last=ex.reduce((a,b)=>b.e>a.e?b:a);ns=snap(Math.min(last.e+60,TL_E-MIN_D));ne=Math.min(ns+MIN_D,TL_E);}
  if(!plGuard(eid,dk,ns,ne))return;
  setShifts(dk,eid,[...ex,{s:ns,e:ne,poste:mainP(emp||{})}]);renderPlanning();
}

// ═══════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════
function initDrag(){
  document.addEventListener('mousedown',pDown,true);
  document.addEventListener('touchstart',pDown,{capture:true,passive:false});
  document.addEventListener('mousemove',pMove,true);
  document.addEventListener('touchmove',pMove,{capture:true,passive:false});
  document.addEventListener('mouseup',pUp,true);
  document.addEventListener('touchend',pUp,{capture:true,passive:false});
}
function coord(e){
  if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches&&e.changedTouches.length)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}
function pDown(e){
  const{x,y}=coord(e),el=document.elementFromPoint(x,y);if(!el)return;
  if(el.closest('[data-role="del"]')){e.stopPropagation();e.preventDefault();const b=el.closest('[data-blk]');if(b)delShift(b.dataset.eid,b.dataset.dk,+b.dataset.idx);return;}
  if(el.closest('[data-role="poste"]')){e.stopPropagation();DRAG={type:'poste',x0:x,y0:y,el};return;}
  const lh=el.closest('[data-role="left"]'),rh=el.closest('[data-role="right"]'),mv=el.closest('[data-role="move"]');
  const handle=lh||rh||mv;
  if(handle){const b=handle.closest('[data-blk]');if(!b)return;const sh=shifts(b.dataset.dk,b.dataset.eid)[+b.dataset.idx];if(!sh)return;
    e.stopPropagation();e.preventDefault();
    DRAG={type:lh?'left':rh?'right':'move',eid:b.dataset.eid,dk:b.dataset.dk,idx:+b.dataset.idx,x0:x,oS:sh.s,oE:sh.e,cs:sh.s,ce:sh.e,moved:false};
    document.body.style.cursor=mv?'grabbing':'ew-resize';return;
  }
  const tr=el.closest('.track[data-eid]');
  if(tr&&!el.closest('[data-blk]'))DRAG={type:'click',eid:tr.dataset.eid,dk:tr.dataset.dk,track:tr,x0:x,y0:y};
}
function pMove(e){
  if(!DRAG)return;
  if(DRAG.type==='click'){const{x,y}=coord(e);if(Math.abs(x-DRAG.x0)>6||Math.abs(y-DRAG.y0)>6)DRAG=null;return;}
  if(DRAG.type==='poste')return;
  if(e.cancelable)e.preventDefault();e.stopPropagation();
  const{x}=coord(e),dm=(x-DRAG.x0)/PX,dur=DRAG.oE-DRAG.oS;
  let ns=DRAG.oS,ne=DRAG.oE;
  if(DRAG.type==='move'){ns=snap(clamp(DRAG.oS+dm,TL_S,TL_E-dur));ne=ns+dur;}
  else if(DRAG.type==='left'){ns=snap(clamp(DRAG.oS+dm,TL_S,DRAG.oE-MIN_D));}
  else if(DRAG.type==='right'){ne=snap(clamp(DRAG.oE+dm,DRAG.oS+MIN_D,TL_E));}
  DRAG.cs=ns;DRAG.ce=ne;DRAG.moved=true;
  const b=document.getElementById('blk-'+DRAG.eid+'-'+DRAG.idx);
  if(b){b.style.left=m2px(ns)+'px';b.style.width=(m2px(ne)-m2px(ns))+'px';
    const bt=b.querySelector('[data-t="bt"]');if(bt)bt.textContent=fT(ns)+'–'+fT(ne);
    const bd=b.querySelector('[data-t="bd"]');if(bd)bd.textContent=fDur(ne-ns);}
}
function pUp(e){
  if(!DRAG)return;
  const{x,y}=coord(e),d=DRAG;DRAG=null;document.body.style.cursor='';
  if(d.type==='poste'){if(Math.abs(x-d.x0)<8&&Math.abs(y-d.y0)<8){const b=d.el.closest('[data-blk]');if(b)showPostePicker(b.dataset.eid,b.dataset.dk,+b.dataset.idx,d.el);}return;}
  if(d.type==='click'){if(Math.abs(x-d.x0)<8&&Math.abs(y-d.y0)<8){if(!absGuard(d.eid,d.dk))return;const rect=d.track.getBoundingClientRect(),cm=snap(clamp(px2m(x-rect.left),TL_S,TL_E-MIN_D));const emp=S.emps.find(e=>e.id===d.eid);if(!plGuard(d.eid,d.dk,cm,Math.min(cm+MIN_D,TL_E)))return;setShifts(d.dk,d.eid,[...shifts(d.dk,d.eid),{s:cm,e:Math.min(cm+MIN_D,TL_E),poste:mainP(emp||{})}]);renderPlanning();}return;}
  if(d.moved){const arr=shifts(d.dk,d.eid);if(arr[d.idx]&&!plGuard(d.eid,d.dk,d.cs,d.ce)){renderPlanning();return;}if(arr[d.idx]){arr[d.idx].s=d.cs;arr[d.idx].e=d.ce;setShifts(d.dk,d.eid,arr);renderPlanning();}}
}

function buildTimeline(dk){
  const PS_=getPS(),grp={};
  getPostes().forEach(p=>{grp[p.id]=[];});
  S.emps.forEach(e=>(grp[mainP(e)]||grp[getPostes()[0].id]).push(e));
  const hrs=Array.from({length:19},(_,i)=>i+6);
  const sph=hrs.map(h=>S.emps.filter(e=>shifts(dk,e.id).some(sh=>sh.s<=h*60&&sh.e>h*60)).length);
  const peak=Math.max(...sph,1);
  const ticks=hrs.map((h,i)=>{
    const maj=h%4===0,c=sph[i],pct=c/peak;
    const bc=c===0?'transparent':c===peak?'#0EA5E9':pct>=.7?'#38BDF8':pct>=.4?'#7DD3FC':'#BAE6FD';
    const bh=c?Math.max(3,Math.round(pct*14)):0;
    return`<div style="position:absolute;left:${m2px(h*60)}px;top:0;bottom:0;pointer-events:none;width:${m2px((h+1)*60)-m2px(h*60)}px">
      <span style="position:absolute;top:0;left:3px;font-size:${maj?10:9}px;color:${maj?'#475569':'#94A3B8'};font-weight:${maj?600:400};line-height:20px;white-space:nowrap">${h<24?h+'h':'0h'}</span>
      <div style="position:absolute;top:20px;left:0;bottom:0;width:1px;background:${maj?'#CBD5E1':'#E2E8F0'}"></div>
      <div style="position:absolute;bottom:0;left:1px;right:0;height:${bh}px;background:${bc};border-radius:2px 2px 0 0"></div>
      ${c?`<span style="position:absolute;bottom:${bh+1}px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:${c===peak?'#0284C7':'#64748B'};line-height:1">${c}</span>`:''}
    </div>`;}).join('');
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const nowLine=iso(now)===dk&&nm>=TL_S&&nm<=TL_E?`<div style="position:absolute;left:${m2px(nm)}px;top:0;bottom:0;width:2px;background:#EF4444;z-index:4;pointer-events:none"><div style="position:absolute;top:3px;left:-4px;width:10px;height:10px;border-radius:50%;background:#EF4444"></div></div>`:'';
  let rows='';
  if(!S.emps.length){
    rows=`<div style="text-align:center;padding:40px;color:#94A3B8"><div style="font-size:32px;margin-bottom:8px">👥</div><div style="font-weight:600">Aucun employé — ajoutez-en dans l'onglet Équipe</div></div>`;
  }else{
    let gi=0;
    getPostes().forEach(poste=>{
      const pe=grp[poste.id]||[];if(!pe.length)return;
      const ps=PS_[poste.id]||{};
      rows+=`<div class="sec-hdr" style="border-color:${ps.bd||'#E2E8F0'}">
        <div class="sec-lbl" style="width:${EC_W}px;color:${ps.tx||'#374151'};border-color:${ps.bd||'#E2E8F0'};background:${ps.bg||'#F8FAFC'}">
          <span style="width:7px;height:7px;border-radius:50%;background:${ps.dot||'#94A3B8'};flex-shrink:0;display:inline-block"></span>${poste.ico||''} ${poste.id}
        </div>
        <div style="flex:1;background:${ps.bg||'#F8FAFC'}"></div>
      </div>`;
      pe.forEach(emp=>{
        const shs=shifts(dk,emp.id),rh=rowH(shs.length),wh=Math.round(wkH(emp.id)*10)/10,dm=dayMin(dk,emp.id);
        const over=wh>emp.heures,under=wh>0&&wh<emp.heures*.85,z=gi%2?'#F7FAFF':'#fff';gi++;
        const addBtn=shs.length
          ?`<button onclick="addShift('${emp.id}','${dk}')" style="width:22px;height:22px;border-radius:50%;border:1px solid #86EFAC;background:#F0FDF4;color:#16A34A;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0">＋</button>`
          :`<button onclick="createFirst('${emp.id}','${dk}')" style="width:22px;height:22px;border-radius:50%;border:1px solid #BAE6FD;background:#EFF6FF;color:#0369A1;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0">＋</button>`;
        rows+=`<div style="display:flex;height:${rh}px;border-bottom:1px solid #F1F5F9">
          <div style="width:${EC_W}px;flex-shrink:0;height:${rh}px;padding:6px 8px;position:sticky;left:0;background:${z};z-index:5;border-right:1px solid #F1F5F9;display:flex;align-items:center;gap:5px">
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:12px;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${emp.prenom} ${emp.nom}</div>
              <div style="font-size:10px;color:${over?'#DC2626':under?'#D97706':'#94A3B8'}">${wh}h/${emp.heures}h</div>
              ${absOn(emp.id,dk)?`<div style="font-size:10px;font-weight:700;color:${absType(absOn(emp.id,dk).type).tx}">${absType(absOn(emp.id,dk).type).ico} Absent</div>`:''}
              ${dm?`<div style="font-size:10px;color:#0EA5E9;font-weight:600">${fDur(dm)}</div>`:''}
            </div>${addBtn}
          </div>
          <div class="track" data-eid="${emp.id}" data-dk="${dk}"
            style="position:relative;width:${TL_W}px;height:${rh}px;flex-shrink:0;background-color:${z};
              background-image:repeating-linear-gradient(90deg,transparent 0,transparent 119px,rgba(0,0,0,.04) 119px,rgba(0,0,0,.04) 120px);
              cursor:crosshair;touch-action:none">
            ${nowLine}${dispoOverlay(emp,dk)}${absOverlay(emp.id,dk)}${buildBlocks(emp,shs,dk)}
          </div>
        </div>`;
      });
    });
  }
  return`<div class="tl-outer">
    <div id="tl-top" style="overflow-x:auto;overflow-y:hidden;height:14px;border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:20;background:#F8FAFC" onscroll="syncScroll('top')">
      <div style="width:${EC_W+TL_W}px;height:1px"></div>
    </div>
    <div id="tl-main" style="overflow-x:auto;-webkit-overflow-scrolling:touch" onscroll="syncScroll('main')">
      <div style="min-width:${EC_W+TL_W}px">
        <div style="display:flex;border-bottom:2px solid #E2E8F0;background:#F8FAFC;position:sticky;top:14px;z-index:10">
          <div style="width:${EC_W}px;flex-shrink:0;padding:5px 10px;font-size:11px;font-weight:600;color:#64748B;position:sticky;left:0;background:#F8FAFC;z-index:11;border-right:1px solid #E2E8F0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:4px">
            <div>Employé</div><div style="font-size:9px;color:#94A3B8;font-weight:500">équipiers/h →</div>
          </div>
          <div style="position:relative;width:${TL_W}px;height:46px;flex-shrink:0">${ticks}</div>
        </div>
        ${rows}
      </div>
    </div>
    <div style="padding:5px 12px;border-top:1px solid #F1F5F9;font-size:10px;color:#94A3B8;background:#F8FAFC;display:flex;gap:10px">
      <span>Barre en haut ↔ pour scroller</span><span>⋮ Tirer les bords</span>
    </div>
  </div>`;
}
let _scrollLock=false;
function syncScroll(src){if(_scrollLock)return;_scrollLock=true;const t=document.getElementById('tl-top'),m=document.getElementById('tl-main');if(t&&m){if(src==='top')m.scrollLeft=t.scrollLeft;else t.scrollLeft=m.scrollLeft;}_scrollLock=false;}

function buildBlocks(emp,shs,dk){
  const PS_=getPS();
  return shs.map((sh,idx)=>{
    const w=m2px(sh.e)-m2px(sh.s),narrow=w<110,vNarrow=w<50;
    const poste=sh.poste||mainP(emp),ps=PS_[poste]||(PS_[getPostes()[0].id]||{});
    const pc=getPostes().find(p=>p.id===poste)||getPostes()[0];
    const hors=!inContract(emp,dk)||!isAvail(emp,dk,sh.s,sh.e);
    return`<div id="blk-${emp.id}-${idx}" data-blk="1" data-eid="${emp.id}" data-dk="${dk}" data-idx="${idx}"
      style="position:absolute;left:${m2px(sh.s)}px;width:${w}px;top:${bTop(idx)}px;height:${BH}px;
             background:${ps.bg||'#EFF6FF'};border:${hors?'2px dashed #DC2626':'1.5px solid '+(ps.bd||'#BFDBFE')};border-radius:8px;
             display:flex;align-items:stretch;box-shadow:0 1px 5px rgba(0,0,0,.12);z-index:2;overflow:visible;min-width:20px">
      <div data-role="left" style="position:absolute;left:0;top:0;bottom:0;width:12px;cursor:ew-resize;background:${ps.bd||'#BFDBFE'};border-radius:7px 0 0 7px;display:flex;align-items:center;justify-content:center;z-index:3"><span style="font-size:8px;color:${ps.tx||'#1E40AF'};pointer-events:none;user-select:none">⋮</span></div>
      <div data-role="move" style="flex:1;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;overflow:hidden;user-select:none">
        ${vNarrow?`<span style="font-size:9px;color:${ps.tx||'#1E40AF'};pointer-events:none">•</span>`:
        `<span data-t="bt" style="font-size:10px;font-weight:800;color:${ps.tx||'#1E40AF'};white-space:nowrap;line-height:1.3;pointer-events:none">${fT(sh.s)}–${fT(sh.e)}</span>
         ${!narrow?`<span data-t="bd" style="font-size:9px;color:${ps.tx||'#1E40AF'};opacity:.7;pointer-events:none">${fDur(sh.e-sh.s)}</span>`:''}
         <span data-role="poste" style="padding:1px 6px;border-radius:8px;font-size:8px;font-weight:700;cursor:pointer;background:${ps.bd||'#BFDBFE'};color:${ps.tx||'#1E40AF'};margin-top:2px;white-space:nowrap">${pc.ico||''} ${poste}</span>`}
      </div>
      <div data-role="right" style="position:absolute;right:0;top:0;bottom:0;width:12px;cursor:ew-resize;background:${ps.bd||'#BFDBFE'};border-radius:0 7px 7px 0;display:flex;align-items:center;justify-content:center;z-index:3"><span style="font-size:8px;color:${ps.tx||'#1E40AF'};pointer-events:none;user-select:none">⋮</span></div>
      <button data-role="del" style="position:absolute;top:-7px;right:-7px;width:17px;height:17px;border-radius:50%;border:1.5px solid ${ps.bd||'#BFDBFE'};background:#fff;color:#BE123C;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;z-index:5;box-shadow:0 1px 3px rgba(0,0,0,.15)">×</button>
    </div>`;}).join('');
}

function renderTableau(){
  const ds=days(),f=S.fc[SEL]||{},needs=calcNeeds(f),PS_=getPS();
  const hrs=Array.from({length:19},(_,i)=>i+6);
  const activeHrs=hrs.filter(h=>S.emps.some(e=>shifts(SEL,e.id).some(sh=>sh.s<=h*60&&sh.e>h*60)));
  const dHrs=activeHrs.length?activeHrs:hrs.slice(5,17);
  function cAt(p,h){const hm=h*60;return S.emps.filter(e=>shifts(SEL,e.id).some(sh=>sh.s<=hm&&sh.e>hm&&(sh.poste||mainP(e))===p)).length;}
  function nAt(p,h){const hm=h*60;return S.emps.filter(e=>shifts(SEL,e.id).some(sh=>sh.s<=hm&&sh.e>hm&&(sh.poste||mainP(e))===p)).map(e=>e.prenom).join(', ');}
  const tph=dHrs.map(h=>S.emps.filter(e=>shifts(SEL,e.id).some(sh=>sh.s<=h*60&&sh.e>h*60)).length);
  const pkT=Math.max(...tph,1);
  const pills=ds.map(d=>{const dk=iso(d),sel=dk===SEL,we=isWE(d);
    return`<button class="pill${sel?' active':''}${!sel&&we?' we':''}" onclick="SEL='${dk}';renderTableau()"><span style="text-transform:capitalize">${fDay(d)}</span></button>`;}).join('');
  const activeP=getPostes().filter(p=>(needs[p.id]||0)>0||dHrs.some(h=>cAt(p.id,h)>0));
  document.getElementById('tab-tableau').innerHTML=`
    <div class="row" style="gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:8px">
      <div><div style="font-size:17px;font-weight:800;color:#0F172A">📊 Tableau de positionnement</div>
      <div style="font-size:12px;color:#64748B;text-transform:capitalize">${new Date(SEL+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div></div>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <button class="btn-sec" onclick="changeWeek(-1)">‹</button><button class="btn-sec" onclick="changeWeek(1)">›</button>
        <button class="btn-sec" onclick="goToday()">Auj.</button><button class="btn-pri" onclick="printTableau()">🖨️</button>
      </div>

    <div class="pills" style="margin-bottom:8px">${pills}</div>
    <div style="overflow-x:auto;border-radius:10px;border:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,.07);background:#fff">
    <table id="pos-table" style="border-collapse:collapse;min-width:${120+dHrs.length*50}px;width:100%">
      <thead><tr style="background:#F8FAFC;border-bottom:2px solid #E2E8F0">
        <th style="padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:#64748B;position:sticky;left:0;background:#F8FAFC;z-index:5;min-width:100px;border-right:2px solid #E2E8F0">Poste / Heure</th>
        ${dHrs.map((h,i)=>{const tot=tph[i],pct=tot/pkT,bg=tot?tot===pkT?'#0EA5E9':pct>=.7?'#38BDF8':pct>=.4?'#BAE6FD':'#E0F2FE':'transparent',tc=tot?tot===pkT?'#fff':'#0369A1':'#CBD5E1';
          return`<th style="padding:5px 2px;text-align:center;font-size:10px;font-weight:600;color:#374151;min-width:46px;border-right:1px solid #F1F5F9"><div>${h}h</div>${tot?`<div style="margin:2px auto 0;width:30px;padding:1px 3px;border-radius:8px;background:${bg};color:${tc};font-size:10px;font-weight:800">${tot}</div>`:'<div style="height:18px"></div>'}</th>`;}).join('')}
        <th style="padding:6px 8px;text-align:center;font-size:10px;font-weight:700;color:#0369A1;min-width:50px;border-left:2px solid #E2E8F0;background:#F0F9FF">Besoin</th>
      </tr></thead>
      <tbody>
        ${activeP.map((poste,pi)=>{const ps=PS_[poste.id]||{},need=needs[poste.id]||0,rc=dHrs.map(h=>cAt(poste.id,h)),pk=Math.max(...rc,0);
          return`<tr style="border-bottom:1px solid #F1F5F9;background:${pi%2?'#FAFCFF':'#fff'}">
            <td style="padding:8px 10px;position:sticky;left:0;background:${pi%2?'#FAFCFF':'#fff'};z-index:3;border-right:2px solid #E2E8F0">
              <div style="display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;border-radius:50%;background:${ps.dot||'#94A3B8'};flex-shrink:0;display:inline-block"></span><span style="font-size:12px;font-weight:700;color:${ps.tx||'#374151'}">${poste.ico||''} ${poste.id}</span></div>
            </td>
            ${dHrs.map((h,i)=>{const c=rc[i],nm=nAt(poste.id,h),bg=c&&c>=need&&need>0?'#F0FDF4':c&&c===pk&&c>0?ps.bg||'#EFF6FF':'#fff',bd=c&&c>=need&&need>0?'1px solid #86EFAC':c?`1px solid ${ps.bd||'#BFDBFE'}`:'1px solid #F1F5F9';
              return`<td title="${nm||'—'}" style="padding:3px 2px;text-align:center;border-right:1px solid #F1F5F9"><div style="margin:0 auto;width:32px;height:22px;border-radius:6px;background:${c?bg:'#F8FAFC'};border:${bd};display:flex;align-items:center;justify-content:center"><span style="font-size:${c?12:10}px;font-weight:${c?800:400};color:${c&&c>=need&&need>0?'#16A34A':c?ps.tx||'#1E40AF':'#E2E8F0'}">${c||'—'}</span></div></td>`;}).join('')}
            <td style="padding:5px 6px;text-align:center;border-left:2px solid #E2E8F0;background:${pi%2?'#EBF7FF':'#F0F9FF'}">${need?`<div style="width:32px;height:22px;border-radius:6px;background:#0EA5E9;display:flex;align-items:center;justify-content:center;margin:0 auto"><span style="font-size:12px;font-weight:800;color:#fff">${need}</span></div>`:'<span style="font-size:10px;color:#CBD5E1">—</span>'}</td>

        <tr style="background:#F0F9FF;border-top:2px solid #BAE6FD">
          <td style="padding:8px 10px;position:sticky;left:0;background:#F0F9FF;z-index:3;border-right:2px solid #E2E8F0;font-size:12px;font-weight:800;color:#0369A1">TOTAL</td>
          ${dHrs.map((h,i)=>{const tot=tph[i],pk=tot===pkT&&tot>0;return`<td style="padding:3px 2px;text-align:center;border-right:1px solid #BAE6FD"><div style="margin:0 auto;width:32px;height:22px;border-radius:6px;background:${tot?pk?'#0EA5E9':'#BAE6FD':'#F8FAFC'};display:flex;align-items:center;justify-content:center"><span style="font-size:12px;font-weight:800;color:${tot?pk?'#fff':'#0369A1':'#E2E8F0'}">${tot||'0'}</span></div></td>`;}).join('')}
          <td style="padding:5px 6px;text-align:center;border-left:2px solid #BAE6FD;background:#E0F2FE"><div style="width:32px;height:22px;border-radius:6px;background:#0369A1;display:flex;align-items:center;justify-content:center;margin:0 auto"><span style="font-size:12px;font-weight:800;color:#fff">${Object.values(needs).reduce((s,v)=>s+(+v||0),0)}</span></div></td>
        </tr>
      </tbody>
    </table></div>`;
}
function printTableau(){
  const tbl=document.getElementById('pos-table');if(!tbl)return;

function renderPosition(){
  const ds=days();if(!ds.map(iso).includes(SEL))SEL=iso(ds[0]);
  const PS_=getPS(),needs=calcNeeds(S.fc[SEL]||{});
  const pills=ds.map(d=>{const dk=iso(d),sel=dk===SEL,we=isWE(d);
    return`<button class="pill${sel?' active':''}${!sel&&we?' we':''}" onclick="SEL='${dk}';renderPosition()"><span style="text-transform:capitalize">${fDay(d)}</span></button>`;}).join('');
  function empsByPoste(poste){return S.emps.filter(e=>shifts(SEL,e.id).some(sh=>(sh.poste||mainP(e))===poste));}
  function getHrs(eid,poste){const shs=shifts(SEL,eid).filter(sh=>(sh.poste||mainP(S.emps.find(e=>e.id===eid)||{}))===poste);return(shs.length?shs:shifts(SEL,eid)).map(sh=>fT(sh.s)+'–'+fT(sh.e)).join(' ');}

function getCHRAlerts(){
  const alerts=[];
  const now=new Date();
  S.emps.forEach(emp=>{
    // CDD arrivant à échéance dans 30 jours
    if((emp._contractType==='CDD')&&emp.contractEnd){
      const end=emp.contractEnd.toDate?emp.contractEnd.toDate():new Date(emp.contractEnd);
      const diff=Math.ceil((end-now)/86400000);
      if(diff<=30&&diff>0) alerts.push({type:'warn',ico:'⚠️',msg:`${emp.prenom} ${emp.nom} — CDD se termine dans ${diff} jour${diff>1?'s':''} (${end.toLocaleDateString('fr-FR')})`});
      if(diff<=0) alerts.push({type:'warn',ico:'🔴',msg:`${emp.prenom} ${emp.nom} — CDD expiré depuis ${Math.abs(diff)} jour${Math.abs(diff)>1?'s':''}`});
    }
    // Période d'essai
    if(emp.trialEndDate){
      const te=emp.trialEndDate.toDate?emp.trialEndDate.toDate():new Date(emp.trialEndDate);
      const diff=Math.ceil((te-now)/86400000);
      if(diff>0&&diff<=14) alerts.push({type:'info',ico:'📋',msg:`${emp.prenom} ${emp.nom} — Période d'essai se termine dans ${diff} jour${diff>1?'s':''}`});
    }
  });
  return alerts.concat(getAbsAlerts(),getPlanAlerts());
}

function buildEmpModal(e){
  document.getElementById('modal-root').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">

          </div>
          <div><label class="fld-lbl">Postes <span style="font-weight:400;color:#94A3B8">(⭐ = principal)</span></label><div id="mpl">${buildPL()}</div></div>

          </div>
        </div>

          <button onclick="closeModal()" style="padding:9px 16px;border-radius:8px;border:1px solid #E2E8F0;background:#fff;font-size:13px">Annuler</button>
          <button onclick="saveEmp()" class="btn-pri">${e.id?'Enregistrer':'Ajouter ✓'}</button>
        </div>
      </div>

}
function buildPL(){const PS_=getPS();return getPostes().map(p=>{const sel=mPostes.includes(p.id),ps=PS_[p.id]||{},idx=mPostes.indexOf(p.id);
  return`<div onclick="toggleP('${p.id}')" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:2px solid ${sel?ps.dot||'#0EA5E9':'#E2E8F0'};background:${sel?ps.bg||'#EFF6FF':'#fff'};cursor:pointer;margin-bottom:4px">
    <span style="font-size:14px">${p.ico||'📌'}</span>
    <span style="font-size:13px;font-weight:500;flex:1;color:${sel?ps.tx||'#0369A1':'#374151'}">${p.id}</span>
    ${sel&&idx===0?`<span style="font-size:11px;font-weight:700;color:${ps.tx||'#0369A1'}">⭐</span>`:''}
    <span style="font-size:14px;color:${sel?ps.dot||'#0EA5E9':'#E2E8F0'}">${sel?'✓':'○'}</span>
  </div>`;}). join('');}
function toggleP(p){const i=mPostes.indexOf(p);i>=0?mPostes.splice(i,1):mPostes.push(p);const el=document.getElementById('mpl');if(el)el.innerHTML=buildPL();}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function setH(h){document.getElementById('mh').value=h;syncH(h);}
function syncH(v){[20,25,30,35].forEach(h=>{const b=document.getElementById('hb'+h);if(b)b.classList.toggle('sel',+v===h);});}
function saveEmp(){
  const prenom=(document.getElementById('mp').value||'').trim(),nom=(document.getElementById('mn').value||'').trim();
  if(!prenom||!nom){alert('Prénom et Nom requis.');return;}
  if(!mPostes.length){alert('Sélectionnez au moins un poste.');return;}
  const heures=+document.getElementById('mh').value||35;
  const name=nom?`${prenom} ${nom}`:prenom;
  if(editEmp?.id){
    // update existing employee
    const existing=editEmp;
    db.collection('employees').doc(editEmp.id).update({
      name,
      postes:[...mPostes],
      contractHours:heures,
      // preserve pointeuse fields
      ...(existing._contractType?{contractType:existing._contractType}:{}),
      ...(existing._plannedTime!=null?{plannedTime:existing._plannedTime}:{}),
    }).catch(e=>alert('Erreur sauvegarde: '+e.message));
  } else {
    // create new employee in shared collection
    db.collection('employees').add({
      name,
      postes:[...mPostes],
      contractHours:heures,
      contractType:'CDI',
      plannedTime:heures,
      active:true,
      pinHash:null,
      createdAt:firebase.firestore.Timestamp.now()
    }).catch(e=>alert('Erreur création: '+e.message));
  }
  closeModal();
}
function delEmp(id){
  if(!confirm('Supprimer cet employé ? (aussi dans la pointeuse)'))return;
  db.collection('employees').doc(id).update({active:false})
    .catch(e=>alert('Erreur suppression: '+e.message));
}

          isDefault:true
        }).catch(e=>console.warn('Template init error:',e));

function downloadTemplate(type){
  const tpl=S.templates[type];
  if(!tpl||!tpl.base64){alert('Modèle non disponible.');return;}
  const bytes=Uint8Array.from(atob(tpl.base64),c=>c.charCodeAt(0));
  const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=tpl.fileName||`contrat_${type}.docx`;
  a.click();
}

function uploadTemplate(type,input){
  const file=input.files[0];
  if(!file)return;
  if(!file.name.endsWith('.docx')){alert('Veuillez choisir un fichier .docx');input.value='';return;}
  if(file.size>700*1024){alert(`Fichier trop lourd (${Math.round(file.size/1024)} Ko). Maximum 700 Ko — compressez les images du modèle dans Word (Fichier › Compresser les images).`);input.value='';return;}
  const reader=new FileReader();
  reader.onload=async e=>{
    const b64=bufToB64(e.target.result);
    const data={nom:TEMPLATE_LABELS[type],fileName:file.name,base64:b64,uploadedAt:firebase.firestore.Timestamp.now(),isDefault:false};
    try{
      await db.collection('contrats-modeles').doc(type).set(data);
      S.templates[type]=data;
      const el=document.getElementById('tpl-section');if(el)el.innerHTML=buildTemplateCards();
      alert(`✅ Modèle "${TEMPLATE_LABELS[type]}" mis à jour avec "${file.name}"`);
    }catch(err){alert('Erreur lors de la sauvegarde : '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

// ── Helpers v27 ──
function bufToB64(buf){const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function escXml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function unsplitPlaceholder(xml,key){
  const re=new RegExp(key.split('').map(c=>c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('(?:<[^>]+>)*'),'g');
  return xml.replace(re,key);
}
function cleanNIR(v){return String(v||'').toUpperCase().replace(/[^0-9AB]/g,'');}
function nirValid(v){
  const n=cleanNIR(v);if(!/^[12378]\d{4}(\d{2}|2A|2B)\d{6}\d{2}$/.test(n))return false;
  const body=n.slice(0,13).replace('2A','19').replace('2B','18');
  return 97-Number(BigInt(body)%97n)===+n.slice(13);
}
function fmtNIR(v){const n=cleanNIR(v);if(!n)return'';return[n.slice(0,1),n.slice(1,3),n.slice(3,5),n.slice(5,7),n.slice(7,10),n.slice(10,13),n.slice(13,15)].filter(Boolean).join(' ');}
function checkNIRField(el){
  const n=cleanNIR(el.value),m=document.getElementById('rh-nir-msg');if(!m)return;
  if(!n){m.textContent='';return;}
  if(n.length<15){m.style.color='#94A3B8';m.textContent=`${n.length}/15 caractères`;return;}
  const ok=nirValid(n);m.style.color=ok?'#16A34A':'#DC2626';m.textContent=ok?'✓ Clé valide':'⚠️ Clé invalide — vérifiez le numéro';
}

async function generateContractWord(empId){
  const emp=S.emps.find(e=>e.id===empId);
  if(!emp){alert('Employé introuvable.');return;}
  const ct=(emp._contractType||'CDI').toLowerCase();
  // Cherche le bon modèle : CDI/CDD/Apprenti/Stage → équipier, Manager → manager, sinon équipier
  const tplSel=document.getElementById('rh-ctpl');
  const tplType=(tplSel&&tplSel.value)||emp.contractTemplate||'equipier';
  const tpl=S.templates[tplType];
  const b64=tpl?tpl.base64:DEFAULT_TEMPLATES[tplType];
  if(!b64){alert('Modèle introuvable. Vérifiez les modèles dans Paramètres.');return;}

  const fmtDate=ts=>{if(!ts)return'_______________';const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});};
  const today=new Date().toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});

  const placeholders={
    '{{PRENOM}}':emp.prenom||'',
    '{{NOM}}':emp.nom||'',
    '{{PRENOM_NOM}}':`${emp.prenom||''} ${emp.nom||''}`.trim(),
    '{{NOM_PRENOM}}':`${emp.nom||''} ${emp.prenom||''}`.trim(),
    '{{POSTE}}':(emp.postes||[])[0]||'',
    '{{POSTES}}':(emp.postes||[]).join(', '),
    '{{HEURES}}':String(emp.heures||35),
    '{{CONTRAT_TYPE}}':emp._contractType||'CDI',
    '{{SALAIRE_BRUT}}':emp.grossSalary?emp.grossSalary+' €':'_______________',
    '{{SALAIRE_NET}}':emp.grossSalary?Math.round(emp.grossSalary*0.78)+' €':'_______________',
    '{{DATE_ENTREE}}':fmtDate(emp.contractStart),
    '{{DATE_FIN}}':fmtDate(emp.contractEnd),
    '{{PERIODE_ESSAI}}':fmtDate(emp.trialEndDate),
    '{{DATE_JOUR}}':today,
    '{{ADRESSE}}':emp.address||'',
    '{{TELEPHONE}}':emp.phone||'',
    '{{EMAIL}}':emp.email||'',
    '{{NUM_SECU}}':emp.nir?fmtNIR(emp.nir):'_______________',
    '{{MODELE}}':TEMPLATE_LABELS[tplType]||'',
    '{{EMPLOYEUR}}':'La Marmite Bleue',
    '{{VILLE}}':'Saint-Pierre-la-Mer',
  };

  try{
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const zip=await JSZip.loadAsync(bytes);
    if(!zip.file('word/document.xml')){alert('Format .docx invalide (word/document.xml manquant).');return;}
    // Corps + en-têtes + pieds de page
    const parts=Object.keys(zip.files).filter(n=>/^word\/(document|header\d*|footer\d*)\.xml$/.test(n));
    for(const n of parts){
      let xml=await zip.file(n).async('string');
      Object.entries(placeholders).forEach(([k,v])=>{
        xml=unsplitPlaceholder(xml,k);           // recolle {{BALISE}} si Word l'a découpée
        xml=xml.split(k).join(escXml(v||''));    // & < > échappés pour ne pas casser le .docx
      });
      zip.file(n,xml);
    }
    const out=await zip.generateAsync({type:'uint8array',compression:'DEFLATE',compressionOptions:{level:6}});
    const blob=new Blob([out],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`Contrat_${emp.prenom}_${emp.nom}_${new Date().toISOString().slice(0,10)}.docx`;
    a.click();

// ═══════════════════════════════════
const JK=['dim','lun','mar','mer','jeu','ven','sam'];
const DISPO_JOURS=[{k:'lun',l:'Lundi'},{k:'mar',l:'Mardi'},{k:'mer',l:'Mercredi'},{k:'jeu',l:'Jeudi'},{k:'ven',l:'Vendredi'},{k:'sam',l:'Samedi'},{k:'dim',l:'Dimanche'}];
const LEGACY_SLOT_H={mat:[6*60,12*60],am:[12*60,18*60],soir:[18*60,24*60]};
let _tmpDispoH=null;

function mergeRanges(arr){
  const r=(arr||[]).filter(x=>x&&x.e>x.s).map(x=>({s:x.s,e:x.e})).sort((a,b)=>a.s-b.s),out=[];
  r.forEach(x=>{const l=out[out.length-1];if(l&&x.s<=l.e)l.e=Math.max(l.e,x.e);else out.push(x);});
  return out;
}
// Convertit l'ancienne grille Matin / A-midi / Soir en plages horaires
function legacyToRanges(old){
  const o={};
  DISPO_JOURS.forEach(j=>{o[j.k]=mergeRanges(Object.keys(LEGACY_SLOT_H).filter(k=>old?.[j.k]?.[k]).map(k=>({s:LEGACY_SLOT_H[k][0],e:LEGACY_SLOT_H[k][1]})));});
  return o;
}
function dayRanges(emp,dk){const k=JK[new Date(dk+'T12:00').getDay()];return mergeRanges((emp.dispoH||{})[k]);}
// Dispos jamais renseignées → considéré disponible partout
function isAvail(emp,dk,s,e){
  if(!emp||!emp.dispoSet)return true;
  return dayRanges(emp,dk).some(r=>r.s<=s&&r.e>=e);
}
function dayAvail(emp,dk){return !emp.dispoSet||dayRanges(emp,dk).length>0;}
function fRanges(rs){return rs.length?rs.map(r=>fT(r.s)+'–'+(r.e>=1440?'24h':fT(r.e))).join(', '):'indisponible';}
function tsIso(ts){if(!ts)return null;const d=ts.toDate?ts.toDate():new Date(ts);return iso(d);}
function inContract(emp,dk){
  const s=tsIso(emp.contractStart),e=emp._contractType==='CDD'?tsIso(emp.contractEnd):null;
  return !(s&&dk<s)&&!(e&&dk>e);
}
// Contrôle avant de créer / déplacer un créneau
function plGuard(eid,dk,s,e){
  const emp=S.emps.find(x=>x.id===eid);if(!emp)return true;
  const pb=[];
  if(!inContract(emp,dk))pb.push('en dehors de sa période de contrat');
  if(!isAvail(emp,dk,s,e))pb.push(`hors de ses disponibilités (${fRanges(dayRanges(emp,dk))})`);
  if(!pb.length)return true;
  return confirm(`${emp.prenom} : créneau ${fT(s)}–${fT(e)} ${pb.join(' et ')}.\nPlanifier quand même ?`);
}
// Premier créneau proposé : dans la première plage dispo du jour
function defaultSlot(emp,dk){
  const rs=emp&&emp.dispoSet?dayRanges(emp,dk):[];
  if(rs.length){const r=rs[0],s=Math.max(r.s,TL_S),e=Math.min(r.e,s+6*60,TL_E);if(e-s>=MIN_D)return{s,e};}
  return{s:11*60+30,e:17*60+30};
}
// Zones grisées dans le Gantt
function dispoOverlay(emp,dk){
  if(!inContract(emp,dk))return`<div style="position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(135deg,#F1F5F9 0,#F1F5F9 8px,#E2E8F0 8px,#E2E8F0 16px);display:flex;align-items:center;padding-left:${m2px(8*60)}px"><span style="padding:3px 10px;border-radius:12px;background:#fff;border:1px solid #CBD5E1;color:#475569;font-size:11px;font-weight:700">📄 Hors période de contrat</span></div>`;
  if(!emp.dispoSet)return'';
  const rs=dayRanges(emp,dk),gaps=[];let cur=TL_S;
  rs.forEach(r=>{if(r.s>cur)gaps.push([cur,Math.min(r.s,TL_E)]);cur=Math.max(cur,r.e);});
  if(cur<TL_E)gaps.push([cur,TL_E]);
  return gaps.filter(g=>g[1]>g[0]).map(g=>`<div title="Non disponible" style="position:absolute;top:0;bottom:0;left:${m2px(g[0])}px;width:${m2px(g[1])-m2px(g[0])}px;z-index:1;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(148,163,184,.10) 0,rgba(148,163,184,.10) 6px,rgba(148,163,184,.28) 6px,rgba(148,163,184,.28) 12px)"></div>`).join('');
}
// Créneaux à venir hors dispo / hors contrat
function getPlanAlerts(){
  const out=[],today=todayIso();
  Object.keys(S.plan).filter(dk=>dk>=today).sort().forEach(dk=>{
    S.emps.forEach(emp=>{
      const shs=shifts(dk,emp.id);if(!shs.length)return;
      if(!inContract(emp,dk))out.push({type:'warn',ico:'📄',msg:`${emp.prenom} ${emp.nom} — planifié le ${fD(dk)} en dehors de sa période de contrat`});
      else if(shs.some(sh=>!isAvail(emp,dk,sh.s,sh.e)))out.push({type:'warn',ico:'🕐',msg:`${emp.prenom} ${emp.nom} — créneau du ${fD(dk)} hors disponibilités (dispo : ${fRanges(dayRanges(emp,dk))})`});
    });
  });
  return out;
}

    _tmpDispoH={_emp:emp.id,_fromLegacy:!emp.dispoSet&&!!emp._dispoRaw};
    DISPO_JOURS.forEach(j=>{_tmpDispoH[j.k]=base?mergeRanges(base[j.k]):[{s:10*60,e:15*60},{s:18*60,e:23*60}];});

    <div class="rh-card">

}
function m2hhmm(m){if(m>=1440)return'00:00';return p2(Math.floor(m/60))+':'+p2(m%60);}
function hhmm2m(v,isEnd){if(!v)return null;const[h,mm]=v.split(':').map(Number);let m=h*60+mm;if(isEnd&&m===0)m=1440;return m;}
function buildDispoDays(){
  return DISPO_JOURS.map(j=>{
    const rs=_tmpDispoH[j.k]||[],we=j.k==='sam'||j.k==='dim';
    return`<div style="padding:8px 0;border-bottom:1px solid #F1F5F9">

        <div style="margin-left:auto;display:flex;gap:4px">

          <button onclick="dispoFull('${j.k}')" style="background:#F0F9FF;border:1px solid #BAE6FD;color:#0369A1;padding:4px 8px;border-radius:6px;font-size:11px">Journée</button>
          <button onclick="dispoNone('${j.k}')" style="background:#FFF1F2;border:1px solid #FECDD3;color:#BE123C;padding:4px 8px;border-radius:6px;font-size:11px">Indispo</button>
        </div>
      </div>
      ${rs.map((r,i)=>`<div style="display:flex;align-items:center;gap:6px;margin:6px 0 0 72px">
        <input type="time" step="900" value="${m2hhmm(r.s)}" onchange="dispoSet('${j.k}',${i},'s',this.value)" style="padding:5px 6px;border:1px solid #86EFAC;border-radius:7px;font-size:13px;background:#F0FDF4">
        <span style="font-size:12px;color:#64748B">→</span>
        <input type="time" step="900" value="${m2hhmm(r.e)}" onchange="dispoSet('${j.k}',${i},'e',this.value)" style="padding:5px 6px;border:1px solid #86EFAC;border-radius:7px;font-size:13px;background:#F0FDF4">
        <button onclick="dispoDel('${j.k}',${i})" style="background:none;border:none;color:#BE123C;font-size:15px;padding:2px 6px">✕</button>

}
function refreshDispoDays(){const el=document.getElementById('dispo-days');if(el)el.innerHTML=buildDispoDays();}
function dispoAdd(k){
  const rs=_tmpDispoH[k],last=rs[rs.length-1];
  const s=last?Math.min(last.e+60,22*60):10*60;rs.push({s,e:Math.min(s+5*60,1440)});refreshDispoDays();
}
function dispoFull(k){_tmpDispoH[k]=[{s:TL_S,e:1440}];refreshDispoDays();}

function dispoSet(k,i,f,v){const m=hhmm2m(v,f==='e');if(m==null)return;_tmpDispoH[k][i][f]=m;}

  {k:'RC', l:'Repos compensateur',   ico:'😴',bg:'#F0FDF4',bd:'#86EFAC',tx:'#14532D'},
  {k:'FAM',l:'Événement familial',   ico:'👨‍👩‍👧',bg:'#FAF5FF',bd:'#D8B4FE',tx:'#581C87'},
  {k:'FOR',l:'Formation',            ico:'🎓',bg:'#EEF2FF',bd:'#A5B4FC',tx:'#3730A3'},
  {k:'CSS',l:'Congé sans solde',     ico:'📭',bg:'#F8FAFC',bd:'#CBD5E1',tx:'#334155'},
  {k:'ABI',l:'Absence injustifiée',  ico:'⚠️',bg:'#FFFBEB',bd:'#FCD34D',tx:'#92400E'},
];
let ABS=[],_unsubAbs=null,_absFilter='',_editAbs=null;

function listenAbsences(){
  if(_unsubAbs)_unsubAbs();
  _unsubAbs=db.collection('absences').onSnapshot(snap=>{
    ABS=snap.docs.map(d=>({id:d.id,...d.data()}));

}
function absType(k){return ABS_TYPES.find(t=>t.k===k)||ABS_TYPES[0];}
function absOn(eid,dk){return ABS.find(a=>a.empId===eid&&a.start<=dk&&a.end>=dk);}
function todayIso(){return iso(new Date());}
function fD(dk){return new Date(dk+'T12:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function joursCal(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000)+1;}

// Jours fériés (France métropolitaine)
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da,12);}
const _ferCache={};
function feries(y){
  if(_ferCache[y])return _ferCache[y];
  const e=easter(y);
  return _ferCache[y]=new Set([`${y}-01-01`,`${y}-05-01`,`${y}-05-08`,`${y}-07-14`,`${y}-08-15`,`${y}-11-01`,`${y}-11-11`,`${y}-12-25`,iso(addD(e,1)),iso(addD(e,39)),iso(addD(e,50))]);
}
// Jours ouvrables = lundi→samedi hors fériés (décompte légal des CP)
function joursOuvrables(a,b){let n=0;for(let d=new Date(a+'T12:00');iso(d)<=b;d=addD(d,1)){if(d.getDay()!==0&&!feries(d.getFullYear()).has(iso(d)))n++;}return n;}
function absDuree(a){return a.type==='CP'?joursOuvrables(a.start,a.end)+' j ouvr.':joursCal(a.start,a.end)+' j';}

// Compteur CP — période de référence 1er juin → 31 mai
function cpPeriode(){const t=new Date(),y=t.getMonth()>=5?t.getFullYear():t.getFullYear()-1;return{deb:`${y}-06-01`,fin:`${y+1}-05-31`};}
function cpCompteur(emp){
  const{deb,fin}=cpPeriode(),today=todayIso();
  let from=deb;
  if(emp.contractStart){const cs=iso(emp.contractStart.toDate?emp.contractStart.toDate():new Date(emp.contractStart));if(cs>from)from=cs;}
  const to=today<fin?today:fin;
  const mois=from<=to?Math.floor(joursCal(from,to)/30.4375):0;
  const acquis=Math.min(30,Math.round(mois*2.5*10)/10);
  const pris=ABS.filter(a=>a.empId===emp.id&&a.type==='CP'&&a.end>=deb&&a.start<=fin)
    .reduce((s,a)=>s+joursOuvrables(a.start>deb?a.start:deb,a.end<fin?a.end:fin),0);
  const report=+emp.cpReport||0;
  return{report,acquis,pris,solde:Math.round((report+acquis-pris)*10)/10};
}

// Alertes CHR liées aux absences
function getAbsAlerts(){
  const out=[],today=todayIso(),j2=iso(addD(new Date(),-2));
  ABS.forEach(a=>{
    const emp=S.emps.find(e=>e.id===a.empId);if(!emp)return;
    const nm=`${emp.prenom} ${emp.nom}`,t=absType(a.type);
    const conf=absConflicts(a.empId,a.start,a.end);
    if(conf.length)out.push({type:'warn',ico:'📅',msg:`${nm} — ${conf.length} jour(s) avec créneau planifié pendant son absence (${t.l}) : ${conf.map(fD).join(', ')}`});
    if(t.decl&&!a.declFaite)out.push({type:'warn',ico:a.start<j2?'🔴':'🚑',msg:`${nm} — Accident du travail du ${fD(a.start)} : déclaration CPAM à faire sous 48 h${a.start<j2?' (délai dépassé)':''}`});
    if(t.just&&!a.justifRecu&&a.start<=j2)out.push({type:'warn',ico:'📄',msg:`${nm} — Arrêt de travail (${t.l}) du ${fD(a.start)} non reçu (à transmettre sous 48 h)`});
    if(t.reprise&&joursCal(a.start,a.end)>=t.reprise){
      const dRet=iso(addD(new Date(a.end+'T12:00'),1)),j14=iso(addD(new Date(),14)),j8=iso(addD(new Date(),-8));
      if(dRet<=j14&&dRet>=j8&&!a.repriseFaite)out.push({type:'info',ico:'🩺',msg:`${nm} — Retour le ${fD(dRet)} après ${joursCal(a.start,a.end)} j d'arrêt : visite de reprise médecine du travail à organiser (dans les 8 jours)`});
    }
    if(a.type==='ABI'&&a.end<=today&&!a.regularise)out.push({type:'warn',ico:'⚠️',msg:`${nm} — Absence injustifiée du ${fD(a.start)} à régulariser (justificatif ou retenue sur salaire)`});

  S.emps.forEach(emp=>{const c=cpCompteur(emp);if(c.solde<0)out.push({type:'warn',ico:'🏖️',msg:`${emp.prenom} ${emp.nom} — Solde de congés payés négatif (${c.solde} j)`});});
  return out;
}

    const flags=[];
    if(t.just)flags.push(a.justifRecu?'📄 Arrêt reçu ✓':'📄 Arrêt non reçu');
    if(t.decl)flags.push(a.declFaite?'🚑 Déclaré ✓':'🚑 À déclarer');
    return`<div style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid ${t.bd};background:${t.bg};margin-bottom:6px">
      <div style="font-size:20px">${t.ico}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:13px;color:#0F172A">${emp?emp.prenom+' '+emp.nom:'(employé supprimé)'}</div>
        <div style="font-size:11px;color:${t.tx};font-weight:600">${t.l} · ${fD(a.start)} → ${fD(a.end)} · ${absDuree(a)}</div>
        ${flags.length?`<div style="font-size:10px;color:#64748B;margin-top:2px">${flags.join(' · ')}</div>`:''}
        ${a.notes?`<div style="font-size:10px;color:#64748B;margin-top:2px;font-style:italic">${a.notes}</div>`:''}
      </div>
      <button onclick="openAbsModal('${a.id}')" style="background:#fff;border:1px solid #E2E8F0;padding:6px 9px;border-radius:7px;font-size:12px">✏️</button>
      <button onclick="delAbs('${a.id}')" style="background:#FFF1F2;border:none;padding:6px 9px;border-radius:7px;font-size:12px;color:#BE123C">🗑️</button>
    </div>`;
  };
  const grid=`<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;min-width:520px">
    <tr><th style="text-align:left;font-size:10px;color:#64748B;padding:4px 6px">Employé</th>${ds.map(d=>`<th style="font-size:10px;color:${isWE(d)?'#DC2626':'#64748B'};padding:4px 2px;text-transform:capitalize">${fDay(d)}</th>`).join('')}</tr>
    ${S.emps.map(e=>`<tr style="border-top:1px solid #F1F5F9"><td style="font-size:12px;font-weight:600;padding:5px 6px;white-space:nowrap">${e.prenom} ${e.nom}</td>${ds.map(d=>{const dk=iso(d),a=absOn(e.id,dk);
      if(a){const t=absType(a.type);return`<td style="padding:2px"><div onclick="openAbsModal('${a.id}')" title="${t.l}" style="cursor:pointer;height:26px;border-radius:6px;background:${t.bg};border:1px solid ${t.bd};display:flex;align-items:center;justify-content:center;font-size:13px">${t.ico}</div></td>`;}
      return`<td style="padding:2px"><div onclick="openAbsModal(null,'${e.id}','${dk}')" style="cursor:pointer;height:26px;border-radius:6px;border:1px dashed #E2E8F0;display:flex;align-items:center;justify-content:center;font-size:11px;color:${shifts(dk,e.id).length?'#0EA5E9':'#E2E8F0'}">${shifts(dk,e.id).length?'●':'+'}</div></td>`;}).join('')}</tr>`).join('')}
  </table></div>`;
  const cps=S.emps.map(e=>{const c=cpCompteur(e);return`<tr style="border-top:1px solid #F1F5F9">
    <td style="font-size:12px;font-weight:600;padding:6px">${e.prenom} ${e.nom}</td>
    <td style="text-align:center;font-size:12px"><button onclick="editCpReport('${e.id}')" style="background:#F1F5F9;border:none;padding:3px 8px;border-radius:6px;font-size:12px">${c.report} ✏️</button></td>
    <td style="text-align:center;font-size:12px">+${c.acquis}</td>
    <td style="text-align:center;font-size:12px">−${c.pris}</td>
    <td style="text-align:center;font-size:13px;font-weight:800;color:${c.solde<0?'#DC2626':'#16A34A'}">${c.solde} j</td></tr>`;}).join('');
  const per=cpPeriode();
  el.innerHTML=`
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <div><div style="font-size:17px;font-weight:800;color:#0F172A">🏖️ Absences</div><div style="font-size:12px;color:#64748B">${ABS.length} absence${ABS.length>1?'s':''} enregistrée${ABS.length>1?'s':''}</div></div>
      <button class="btn-pri" onclick="openAbsModal(null)">+ Absence</button>
    </div>
    ${alerts.length?`<div style="margin-bottom:12px;display:flex;flex-direction:column;gap:6px">${alerts.map(a=>`<div class="alert-chr ${a.type}"><span>${a.ico}</span><span>${a.msg}</span></div>`).join('')}</div>`:`<div class="alert-chr ok" style="margin-bottom:12px"><span>✅</span><span>Aucune alerte en cours</span></div>`}
    <div class="rh-section">
      <div class="rh-card">
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <div class="rh-card-title" style="margin:0">Semaine · ${fWk(MON)}</div>
          <div class="row" style="gap:4px"><button class="btn-sec" onclick="changeWeek(-1)">‹</button><button class="btn-sec" onclick="goToday()">Auj.</button><button class="btn-sec" onclick="changeWeek(1)">›</button></div>
        </div>
        ${S.emps.length?grid:'<div style="font-size:12px;color:#94A3B8">Aucun employé</div>'}
        <div style="font-size:10px;color:#94A3B8;margin-top:6px">Cliquez une case pour ajouter une absence · <span style="color:#0EA5E9">●</span> = créneau planifié</div>
      </div>
      <div class="rh-card">
        <div class="row" style="justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap">
          <div class="rh-card-title" style="margin:0">En cours & à venir</div>
          <select class="tag-select" style="width:auto;padding:5px 8px;font-size:12px" onchange="_absFilter=this.value;renderAbsences()"><option value="">Tous les employés</option>${empOpts}</select>
        </div>
        ${enCours.length?enCours.map(absRow).join(''):'<div style="font-size:12px;color:#94A3B8">Aucune absence prévue</div>'}
      </div>
      <div class="rh-card">
        <div class="rh-card-title">Compteurs congés payés · ${fD(per.deb)} ${per.deb.slice(0,4)} → ${fD(per.fin)} ${per.fin.slice(0,4)}</div>
        <div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%">
          <tr style="font-size:10px;color:#64748B"><th style="text-align:left;padding:4px 6px">Employé</th><th>Report au 1/06</th><th>Acquis</th><th>Pris</th><th>Solde</th></tr>
          ${cps}
        </table></div>
      </div>
      <div class="rh-card">
        <div class="rh-card-title">Historique (90 derniers jours)</div>
        ${passees.length?passees.map(absRow).join(''):'<div style="font-size:12px;color:#94A3B8">Rien sur la période</div>'}
      </div>
      ${rulesCard()}
    </div>`;
}

function editCpReport(empId){
  const emp=S.emps.find(e=>e.id===empId);if(!emp)return;
  const v=prompt(`Solde de CP de ${emp.prenom} au 1er juin (jours ouvrables, reporté de la fiche de paie) :`,emp.cpReport||0);
  if(v===null)return;
  const n=parseFloat(String(v).replace(',','.'));
  if(isNaN(n)){alert('Nombre invalide');return;}
  db.collection('employees').doc(empId).update({cpReport:n}).catch(e=>alert('Erreur: '+e.message));
}

function openAbsModal(absId,empId,dk){
  const a=absId?ABS.find(x=>x.id===absId):null;
  _editAbs=a;
  const v=a||{empId:empId||_absFilter||(S.emps[0]&&S.emps[0].id)||'',type:'CP',start:dk||todayIso(),end:dk||todayIso(),notes:''};
  document.getElementById('modal-root').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-hdr"><span>🏖️</span><span>${a?'Modifier l’absence':'Nouvelle absence'}</span></div>
        <div class="modal-body">
          <div><label class="fld-lbl">Employé</label>
            <select class="tag-select" id="ab-emp" onchange="absPreview()">${S.emps.map(e=>`<option value="${e.id}" ${v.empId===e.id?'selected':''}>${e.prenom} ${e.nom}</option>`).join('')}</select></div>
          <div><label class="fld-lbl">Type</label>
            <select class="tag-select" id="ab-type" onchange="absPreview()">${ABS_TYPES.map(t=>`<option value="${t.k}" ${v.type===t.k?'selected':''}>${t.ico} ${t.l}</option>`).join('')}</select></div>
          <div class="field-row">
            <div><label class="fld-lbl">Du</label><input class="fld-inp" id="ab-start" type="date" value="${v.start}" onchange="if(document.getElementById('ab-end').value<this.value)document.getElementById('ab-end').value=this.value;absPreview()"></div>
            <div><label class="fld-lbl">Au (inclus)</label><input class="fld-inp" id="ab-end" type="date" value="${v.end}" onchange="absPreview()"></div>
          </div>
          <div id="ab-flags"></div>
          <div><label class="fld-lbl">Notes</label><textarea class="fld-inp" id="ab-notes" rows="2" placeholder="Ex : motif, n° d'arrêt…">${v.notes||''}</textarea></div>
          <div id="ab-preview"></div>
        </div>
        <div class="modal-foot">
          <button onclick="closeModal()" class="btn-sec">Annuler</button>
          <button onclick="saveAbs()" class="btn-pri">${a?'Enregistrer':'Ajouter ✓'}</button>
        </div>
      </div>
    </div>`;
  absPreview();
}
function absPreview(){
  const type=document.getElementById('ab-type').value,t=absType(type);
  const s=document.getElementById('ab-start').value,e=document.getElementById('ab-end').value,emp=document.getElementById('ab-emp').value;
  const a=_editAbs||{};
  const prevFlags={};document.querySelectorAll('#ab-flags input').forEach(i=>{prevFlags[i.id]=i.checked;});
  const ck=(id,lbl,val)=>`<label style="display:flex;align-items:center;gap:8px;font-size:12px;color:#374151;padding:6px 8px;border:1px solid #E2E8F0;border-radius:8px;margin-bottom:4px"><input type="checkbox" id="${id}" ${(prevFlags[id]??val)?'checked':''}> ${lbl}</label>`;
  let f='';
  if(t.just)f+=ck('ab-justif','📄 Arrêt de travail reçu',a.justifRecu);
  if(t.decl)f+=ck('ab-decl','🚑 Déclaration AT faite (CPAM / net-entreprises)',a.declFaite);
  if(t.reprise)f+=ck('ab-reprise','🩺 Visite de reprise organisée',a.repriseFaite);
  if(type==='ABI')f+=ck('ab-regul','✅ Absence régularisée',a.regularise);
  document.getElementById('ab-flags').innerHTML=f;
  const box=document.getElementById('ab-preview');
  if(!s||!e||e<s){box.innerHTML=`<div class="alert-chr warn"><span>⚠️</span><span>La date de fin doit être après la date de début</span></div>`;return;}
  const conf=absConflicts(emp,s,e);
  const overlap=ABS.find(x=>x.empId===emp&&x.id!==a.id&&x.start<=e&&x.end>=s);
  let html=`<div class="alert-chr info"><span>📆</span><span>${joursCal(s,e)} jour(s) calendaire(s) · ${joursOuvrables(s,e)} jour(s) ouvrable(s)${type==='CP'?' décompté(s) des CP':''}</span></div>`;
  if(type==='CP'){const em=S.emps.find(x=>x.id===emp);if(em){const c=cpCompteur(em),dej=a.id&&a.type==='CP'?joursOuvrables(a.start,a.end):0,apres=Math.round((c.solde+dej-joursOuvrables(s,e))*10)/10;html+=`<div class="alert-chr ${apres<0?'warn':'ok'}" style="margin-top:6px"><span>🏖️</span><span>Solde CP après cette absence : <b>${apres} j</b></span></div>`;}}
  if(t.reprise&&joursCal(s,e)>=t.reprise)html+=`<div class="alert-chr info" style="margin-top:6px"><span>🩺</span><span>Arrêt ≥ ${t.reprise} jours : visite de reprise obligatoire dans les 8 jours suivant le retour</span></div>`;
  if(overlap){const ot=absType(overlap.type);html+=`<div class="alert-chr warn" style="margin-top:6px"><span>⚠️</span><span>Chevauche une autre absence (${ot.l} du ${fD(overlap.start)} au ${fD(overlap.end)})</span></div>`;}
  if(conf.length)html+=`<div class="alert-chr warn" style="margin-top:6px"><span>📅</span><span>${conf.length} jour(s) avec créneau planifié : ${conf.map(fD).join(', ')} — ils seront retirés du planning si vous confirmez</span></div>`;
  box.innerHTML=html;
}
function saveAbs(){
  const empId=document.getElementById('ab-emp').value,type=document.getElementById('ab-type').value;
  const start=document.getElementById('ab-start').value,end=document.getElementById('ab-end').value;
  const notes=(document.getElementById('ab-notes').value||'').trim();
  if(!empId||!start||!end){alert('Employé et dates requis.');return;}
  if(end<start){alert('La date de fin doit être après la date de début.');return;}
  const a=_editAbs||{};
  if(ABS.find(x=>x.empId===empId&&x.id!==a.id&&x.start<=end&&x.end>=start)&&!confirm('Cette absence chevauche une autre absence. Enregistrer quand même ?'))return;
  const g=id=>{const el=document.getElementById(id);return el?el.checked:false;};
  const data={empId,type,start,end,notes,justifRecu:g('ab-justif'),declFaite:g('ab-decl'),repriseFaite:g('ab-reprise'),regularise:g('ab-regul'),updatedAt:firebase.firestore.Timestamp.now()};
  const conf=absConflicts(empId,start,end);
  if(conf.length&&confirm(`${conf.length} jour(s) ont des créneaux planifiés pendant cette absence.\nLes retirer du planning ?`)){
    conf.forEach(dk=>{if(S.plan[dk])S.plan[dk][empId]=[];});autoSave();
  }
  const op=a.id?db.collection('absences').doc(a.id).update(data):db.collection('absences').add({...data,createdAt:firebase.firestore.Timestamp.now()});
  op.then(()=>{closeModal();refreshTab();}).catch(e=>alert('Erreur: '+e.message));
}
function delAbs(id){
  if(!confirm('Supprimer cette absence ?'))return;
  db.collection('absences').doc(id).delete().catch(e=>alert('Erreur: '+e.message));
}

// ═══════════════════════════════════

init();
</script>
