<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#F1F5F9;display:flex;flex-direction:column}
button,input,select,textarea{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
.hdr{background:linear-gradient(135deg,#0EA5E9,#0369A1);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav{background:#fff;border-bottom:1px solid #E2E8F0;display:flex;flex-shrink:0;overflow-x:auto}
.nav-btn{flex-shrink:0;padding:9px 8px;border:none;background:none;font-size:10px;font-weight:400;color:#94A3B8;border-bottom:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:56px}
.nav-btn .ico{font-size:16px}
.nav-btn.active{font-weight:700;color:#0EA5E9;border-bottom-color:#0EA5E9}
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;-webkit-overflow-scrolling:touch}
.btn-pri{background:linear-gradient(135deg,#0EA5E9,#0284C7);color:#fff;border:none;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;box-shadow:0 2px 8px rgba(14,165,233,.3)}
.btn-sec{background:#fff;border:1px solid #E2E8F0;padding:7px 11px;border-radius:8px;font-size:12px;color:#374151;font-weight:500}
.pills{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.pill{flex-shrink:0;padding:6px 10px 5px;border-radius:9px;border:1px solid #E2E8F0;background:#fff;color:#374151;min-width:50px;text-align:center;font-size:11px}
.pill.active{background:#0EA5E9;color:#fff;font-weight:700;border-color:#0EA5E9;box-shadow:0 2px 8px rgba(14,165,233,.35)}
.pill.we{color:#DC2626}
.card{background:#fff;border-radius:10px;border:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.fc-bar{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #E2E8F0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fc-lbl{display:flex;align-items:center;gap:5px;font-size:11px;color:#64748B;font-weight:600}
.fc-inp{width:72px;padding:4px 6px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px;text-align:center;outline:none}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
.hint{display:flex;gap:6px;padding:6px 10px;background:#F0F9FF;border:1px solid #BAE6FD;border-radius:8px;font-size:11px;color:#0369A1;line-height:1.5}
.tl-outer{background:#fff;border-radius:10px;border:1px solid #E2E8F0;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.sec-hdr{display:flex;border-top:1px solid;border-bottom:1px solid}
.sec-lbl{flex-shrink:0;padding:3px 10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;position:sticky;left:0;z-index:5;border-right:1px solid;display:flex;align-items:center;gap:5px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:999}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
.modal-hdr{background:linear-gradient(135deg,#0EA5E9,#0284C7);color:#fff;padding:13px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:1;border-radius:20px 20px 0 0}
.modal-body{padding:14px;display:flex;flex-direction:column;gap:12px}
.modal-foot{padding:10px 14px;border-top:1px solid #F1F5F9;display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.fld-lbl{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:4px}
.fld-inp{width:100%;padding:9px 11px;border:1px solid #E2E8F0;border-radius:9px;font-size:14px;color:#0F172A;outline:none}
.h-btn{padding:7px 12px;border-radius:7px;border:2px solid #E2E8F0;background:#fff;color:#374151;font-size:13px}
.h-btn.sel{border-color:#0EA5E9;background:#EFF6FF;color:#0369A1;font-weight:700}
#loading{position:fixed;inset:0;background:#F1F5F9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:8888}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:34px;height:34px;border:4px solid #E2E8F0;border-top-color:#0EA5E9;border-radius:50%;animation:spin .8s linear infinite}
.row{display:flex;align-items:center}
@media print{
  body{overflow:visible!important;height:auto!important}
  #app,#loading{display:none!important}
  #print-area{display:block!important}
  .print-page{page-break-after:always;padding:12mm;font-family:Arial,sans-serif}
  .print-page:last-child{page-break-after:avoid}
}
::-webkit-scrollbar{height:6px;width:5px}
::-webkit-scrollbar-track{background:#F1F5F9}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
</style>
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<div id="loading">
  <div style="font-size:40px">🫙</div>
  <div class="spinner"></div>
  <div style="font-size:13px;color:#64748B;font-weight:500">Connexion Firebase…</div>
</div>

<div id="app">
  <div class="hdr">
    <div style="width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0">🫙</div>
    <div style="flex:1">
      <div style="font-weight:800;font-size:15px">La Marmite Bleue</div>
      <div style="font-size:9px;opacity:.7;letter-spacing:.8px">PLANIFICATION DU PERSONNEL</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="font-size:9px;opacity:.55;white-space:nowrap">v.04/10/2026 20:00</div>
      <div id="sync-dot" style="width:8px;height:8px;border-radius:50%;background:#FCD34D;transition:background .3s" title="Sync Firebase"></div>

  <nav class="nav">
    <button class="nav-btn active" onclick="showTab('planning')"><span class="ico">📅</span>Planning</button>

    <button class="nav-btn" onclick="showTab('employes')"><span class="ico">👥</span>Équipe</button>

  <div class="main">

    <div id="tab-tableau"  style="display:none"></div>
    <div id="tab-position" style="display:none"></div>

</div>

<div id="print-area" style="display:none"></div>
<div id="modal-root"></div>

<script>
// ═══════════════════════════════════
// FIREBASE INIT
// ═══════════════════════════════════
firebase.initializeApp({
  apiKey:            "AIzaSyBZ03rRzX8DL5Xgqn7U1p8PfiL83Zqtmvc",
  authDomain:        "pointagemarmitebleue.firebaseapp.com",
  projectId:         "pointagemarmitebleue",
  storageBucket:     "pointagemarmitebleue.firebasestorage.app",
  messagingSenderId: "483578019330",
  appId:             "1:483578019330:web:f15b69bfd7d652b773711b"
});
const db     = firebase.firestore();
const DOCREF = db.collection('marmite-planning').doc('state');

// ═══════════════════════════════════
// POSTES DYNAMIQUES
// ═══════════════════════════════════
const COLOR_PALETTE=[
  {key:'blue',   bg:'#EFF6FF',bd:'#BFDBFE',tx:'#1E40AF',dot:'#3B82F6',label:'Bleu'},
  {key:'orange', bg:'#FFF7ED',bd:'#FED7AA',tx:'#9A3412',dot:'#F97316',label:'Orange'},
  {key:'purple', bg:'#FAF5FF',bd:'#E9D5FF',tx:'#581C87',dot:'#A855F7',label:'Violet'},
  {key:'green',  bg:'#F0FDF4',bd:'#BBF7D0',tx:'#14532D',dot:'#22C55E',label:'Vert'},
  {key:'red',    bg:'#FFF1F2',bd:'#FECDD3',tx:'#9F1239',dot:'#F43F5E',label:'Rouge'},
  {key:'teal',   bg:'#ECFDF5',bd:'#A7F3D0',tx:'#065F46',dot:'#10B981',label:'Turquoise'},
  {key:'yellow', bg:'#FFFBEB',bd:'#FDE68A',tx:'#92400E',dot:'#F59E0B',label:'Jaune'},
  {key:'pink',   bg:'#FDF4FF',bd:'#F0ABFC',tx:'#701A75',dot:'#D946EF',label:'Rose'},
  {key:'indigo', bg:'#EEF2FF',bd:'#C7D2FE',tx:'#3730A3',dot:'#6366F1',label:'Indigo'},
  {key:'cyan',   bg:'#ECFEFF',bd:'#A5F3FC',tx:'#164E63',dot:'#06B6D4',label:'Cyan'},
  {key:'slate',  bg:'#F8FAFC',bd:'#CBD5E1',tx:'#334155',dot:'#64748B',label:'Gris'},
  {key:'lime',   bg:'#F7FEE7',bd:'#D9F99D',tx:'#365314',dot:'#84CC16',label:'Lime'},
];
const DEFAULT_POSTES=[
  {id:'Moule',    ico:'🦪',color:'blue'},
  {id:'Frite',    ico:'🍟',color:'orange'},
  {id:'Bar',      ico:'🍺',color:'purple'},
  {id:'Plonge',   ico:'🧼',color:'green'},
  {id:'Sauce',    ico:'🥣',color:'red'},
  {id:'Livraison',ico:'🛵',color:'teal'},
  {id:'Salle',    ico:'🍽️',color:'yellow'},
  {id:'Dessert',  ico:'🍮',color:'pink'},
];
function getPostes(){return(S.postesConfig&&S.postesConfig.length)?S.postesConfig:DEFAULT_POSTES;}
function getPS(){
  const out={};
  getPostes().forEach(p=>{const c=COLOR_PALETTE.find(x=>x.key===p.color)||COLOR_PALETTE[0];out[p.id]={bg:c.bg,bd:c.bd,tx:c.tx,dot:c.dot};});
  return out;
}

// ═══════════════════════════════════
// CONSTANTES TIMELINE
// ═══════════════════════════════════
const PX=2,TL_S=6*60,TL_E=24*60,SNAP=15,MIN_D=120;
const TL_W=(TL_E-TL_S)*PX,EC_W=130,BH=46,BG=6;

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let S={
  emps:[],fc:{},plan:{},
  par:{ratioMoule:80,ratioFrite:100,ratioSalle:80,seuilBar:1500,seuilPlo:50,ticketMoyen:25},
  postesConfig:[...DEFAULT_POSTES]
};
let MON=monday(new Date()),SEL=iso(new Date()),curTab='planning';
let saveT=null,DRAG=null,_unsub=null;

// ═══════════════════════════════════
// UTILS
// ═══════════════════════════════════
function monday(d){const r=new Date(d);r.setHours(0,0,0,0);r.setDate(r.getDate()-((r.getDay()||7)-1));return r;}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function iso(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function p2(n){return String(n).padStart(2,'0');}
function days(){return Array.from({length:7},(_,i)=>addD(MON,i));}
function fDay(d){return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'});}
function fWk(m){const e=addD(m,6);return m.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' – '+e.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});}
function isWE(d){const w=d.getDay();return w===0||w===6;}
function uid(){return Math.random().toString(36).slice(2,9);}
function m2px(m){return(m-TL_S)*PX;}
function px2m(px){return px/PX+TL_S;}
function snap(m){return Math.round(m/SNAP)*SNAP;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function fT(m){const h=Math.floor(m/60)%24,mm=m%60;return h+'h'+(mm?p2(mm):'');}
function fDur(m){const h=Math.floor(m/60),mm=m%60;return h?(mm?h+'h'+p2(mm):h+'h'):mm+'min';}
function fNum(n){return (+n).toLocaleString('fr-FR');}

// ═══════════════════════════════════
// HELPERS PLANNING
// ═══════════════════════════════════
function mainP(e){return(e.postes||[])[0]||getPostes()[0].id;}
function shifts(dk,eid){
  const v=(S.plan[dk]||{})[eid];
  if(!v)return[];
  return Array.isArray(v)?v:(v.s!=null?[v]:[]);
}
function setShifts(dk,eid,arr){
  if(!S.plan[dk])S.plan[dk]={};
  S.plan[dk][eid]=arr.filter(s=>s&&s.s!=null);
  autoSave();
}
function rowH(n){return 10+Math.max(1,n)*(BH+BG)-BG;}
function bTop(i){return 5+i*(BH+BG);}
function dayMin(dk,eid){return shifts(dk,eid).reduce((s,sh)=>s+sh.e-sh.s,0);}
function wkH(eid){return days().reduce((s,d)=>s+dayMin(iso(d),eid),0)/60;}

// ═══════════════════════════════════
// PRÉVISIONS
// ═══════════════════════════════════
function getTrans(f){
  const ca=+(f.ca)||0,tm=+(f.ticketMoyen)||+(S.par.ticketMoyen)||25;
  return ca&&tm?Math.round(ca/tm):0;
}
function calcNeeds(f){
  const t=getTrans(f),ca=+(f.ca)||0,p=S.par;
  if(!t&&!ca)return Object.fromEntries(getPostes().map(x=>[x.id,0]));
  return{
    Moule:    Math.max(1,Math.ceil(t/(p.ratioMoule||80))),
    Frite:    Math.max(1,Math.ceil(t/(p.ratioFrite||100))),
    Bar:      ca>=(p.seuilBar||1500)?1:0,
    Plonge:   t>=(p.seuilPlo||50)?1:0,
    Sauce:    Math.max(1,Math.ceil(t/(p.ratioFrite||100))),
    Livraison:0,
    Salle:    Math.max(1,Math.ceil(t/(p.ratioSalle||80))),
    Dessert:  t>0?1:0,
  };
}
function prodBadge(dk){
  const f=S.fc[dk]||{},ca=+(f.ca)||0;
  if(!ca)return'';
  const totalMin=S.emps.reduce((s,e)=>s+shifts(dk,e.id).reduce((ss,sh)=>ss+(sh.e-sh.s),0),0);
  const h=totalMin/60;
  if(h<=0)return`<div style="padding:5px 10px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;font-size:11px;color:#92400E">📈 Planifiez des créneaux pour voir la productivité</div>`;
  const eph=Math.round(ca/h),ne=S.emps.filter(e=>shifts(dk,e.id).length>0).length,epe=ne?Math.round(ca/ne):0;
  const col=eph>=250?'#16A34A':eph>=150?'#D97706':'#DC2626';
  const bg=eph>=250?'#F0FDF4':eph>=150?'#FFFBEB':'#FFF1F2';
  const bd=eph>=250?'#86EFAC':eph>=150?'#FDE68A':'#FECDD3';
  return`<div id="prod-badge" style="padding:5px 12px;background:${bg};border:1px solid ${bd};border-radius:9px;font-size:12px;color:${col};font-weight:700;white-space:nowrap">
    📈 ${fNum(eph)} €/h &nbsp;·&nbsp; <span style="font-size:11px;font-weight:500">${h.toFixed(1)}h planifiées</span> &nbsp;·&nbsp; <span style="font-size:11px;font-weight:500">${fNum(epe)} €/équipier</span>
  </div>`;
}
function weekRecap(){
  const ds=days(),maxCA=Math.max(...ds.map(d=>+(S.fc[iso(d)]||{}).ca||0),1);
  const totalCA=ds.reduce((s,d)=>s+(+(S.fc[iso(d)]||{}).ca||0),0);
  const totalT=ds.reduce((s,d)=>s+getTrans(S.fc[iso(d)]||{}),0);
  const bars=ds.map(d=>{
    const dk=iso(d),f=S.fc[dk]||{},ca=+(f.ca)||0,t=getTrans(f),sel=dk===SEL,we=isWE(d);
    const barH=ca?Math.max(4,Math.round((ca/maxCA)*28)):0;
    return`<div onclick="selDay('${dk}')" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 2px;border-radius:7px;background:${sel?'#EFF6FF':'transparent'};border:1px solid ${sel?'#BFDBFE':'transparent'}">
      <div style="font-size:9px;font-weight:${sel?700:500};color:${we?'#DC2626':sel?'#1E40AF':'#64748B'};text-transform:capitalize;white-space:nowrap">${fDay(d)}</div>
      <div style="width:100%;height:30px;display:flex;align-items:flex-end;justify-content:center">
        <div style="width:68%;border-radius:3px 3px 0 0;height:${barH||2}px;background:${barH?sel?'#3B82F6':we?'#FCA5A5':'#93C5FD':'#F1F5F9'};transition:height .25s"></div>
      </div>
      <div style="font-size:10px;font-weight:700;color:${ca?sel?'#1E40AF':'#374151':'#CBD5E1'}">${ca?fNum(ca)+'€':'—'}</div>
      <div style="font-size:9px;color:${sel?'#3B82F6':'#94A3B8'};min-height:12px">${t?t+'t':''}</div>
    </div>`;
  }).join('');
  return`<div id="wk-recap" class="card" style="padding:10px 12px;margin-bottom:8px">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:8px">
      <span style="font-size:11px;font-weight:700;color:#374151">📅 Récap CA semaine</span>
      <div class="row" style="gap:10px">
        ${totalCA?`<span style="font-size:13px;font-weight:800;color:#0369A1">Total : ${fNum(totalCA)} €</span>`:''}
        ${totalT?`<span style="font-size:11px;color:#64748B;font-weight:600">${fNum(totalT)} transactions</span>`:''}
      </div>
    </div>
    <div style="display:flex;gap:3px;align-items:flex-end">${bars}</div>
  </div>`;
}
function needsBadges(dk){
  const needs=calcNeeds(S.fc[dk]||{}),PS_=getPS();
  const html=getPostes().filter(p=>needs[p.id]>0).map(p=>{
    const ps=PS_[p.id]||{},a=S.emps.filter(e=>shifts(dk,e.id).some(sh=>(sh.poste||mainP(e))===p.id)).length;
    const ok=a>=needs[p.id];
    return`<span class="badge" style="background:${ok?'#F0FDF4':ps.bg};border:1px solid ${ok?'#86EFAC':ps.bd};color:${ok?'#16A34A':ps.tx}">
      <i style="width:6px;height:6px;border-radius:50%;background:${ps.dot};display:inline-block;vertical-align:middle;margin-right:2px"></i>${a}/${needs[p.id]} ${p.id}
    </span>`;
  }).join('');
  return html||'<span style="font-size:11px;color:#CBD5E1">Saisir CA + ticket moyen</span>';
}

// ═══════════════════════════════════
// FIREBASE
// ═══════════════════════════════════
function dot(s){const d=document.getElementById('sync-dot');if(d)d.style.background=s==='ok'?'#4ADE80':s==='sync'?'#FCD34D':'#F87171';}
function autoSave(){clearTimeout(saveT);saveT=setTimeout(dbSave,1500);}
function dbSave(){
  dot('sync');
  DOCREF.set(S)
    .then(()=>dot('ok'))
    .catch(e=>{console.error('Save:',e);dot('err');});
}
function applyData(d){
  if(!d)return;
  if(d.emps)S.emps=d.emps.map(e=>({...e,postes:e.postes||(e.poste?[e.poste]:[getPostes()[0].id]),heures:e.heures||35}));
  if(d.fc)S.fc=d.fc;
  if(d.par)S.par={...S.par,...d.par};
  if(d.postesConfig&&d.postesConfig.length)S.postesConfig=d.postesConfig;
  if(d.plan){
    const np={};
    for(const dk in d.plan){np[dk]={};for(const eid in d.plan[dk]){const v=d.plan[dk][eid];np[dk][eid]=Array.isArray(v)?v:(v&&v.s!=null?[v]:[]);}}
    S.plan=np;
  }
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
function init(){
  if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  DOCREF.get()
    .then(snap=>{
      applyData(snap.exists?snap.data():null);
      dot('ok');
      startApp();
      startSync();
    })
    .catch(e=>{
      console.error('Init:',e);
      dot('err');
      startApp();
    });
}
function startApp(){
  document.getElementById('loading').style.display='none';
  const ds=days().map(iso);
  if(!ds.includes(SEL))SEL=ds[0];
  initDrag();
  showTab('planning');
}
function startSync(){
  if(_unsub)_unsub();
  _unsub=DOCREF.onSnapshot(snap=>{
    if(snap.exists&&!DRAG){
      applyData(snap.data());
      dot('ok');
      if(curTab)refreshTab();
    }
  },e=>{console.error('Sync:',e);dot('err');});
}
function refreshTab(){

// ═══════════════════════════════════
// AUTO-GEN
// ═══════════════════════════════════
const AUTO_SL=[{s:11*60+30,e:17*60+30},{s:17*60,e:23*60},{s:11*60+30,e:23*60},{s:12*60,e:18*60},{s:18*60,e:22*60},{s:14*60,e:20*60}];
function autoGen(){
  const ds=days(),np={};
  ds.forEach(d=>{np[iso(d)]={};});
  const worked=Object.fromEntries(S.emps.map(e=>[e.id,0]));
  const target=Object.fromEntries(S.emps.map(e=>[e.id,Math.max(1,Math.round(e.heures/6))]));
  const ranked=[...ds].sort((a,b)=>getTrans(S.fc[iso(b)]||{})-getTrans(S.fc[iso(a)]||{}));
  for(const day of ranked){
    const dk=iso(day);let si=0;
    getPostes().forEach(p=>{
      const need=(calcNeeds(S.fc[dk]||{}))[p.id];if(!need)return;
      const cands=S.emps.filter(e=>(e.postes||[]).includes(p.id)&&!np[dk][e.id]?.length&&worked[e.id]<target[e.id])
        .sort((a,b)=>(target[b.id]-worked[b.id])-(target[a.id]-worked[a.id]));
      let n=0;for(const emp of cands){if(n>=need)break;const sl=AUTO_SL[si%AUTO_SL.length];np[dk][emp.id]=[{s:sl.s,e:sl.e,poste:p.id}];worked[emp.id]++;n++;si++;}
    });
  }
  ds.forEach(d=>{S.plan[iso(d)]=np[iso(d)];});
  autoSave();renderPlanning();
}

function addShift(eid,dk){
  const emp=S.emps.find(e=>e.id===eid),ex=shifts(dk,eid);
  let ns=19*60,ne=23*60;
  if(ex.length){const last=ex.reduce((a,b)=>b.e>a.e?b:a);ns=snap(Math.min(last.e+60,TL_E-MIN_D));ne=Math.min(ns+MIN_D,TL_E);}
  setShifts(dk,eid,[...ex,{s:ns,e:ne,poste:mainP(emp||{})}]);renderPlanning();
}
function delShift(eid,dk,idx){setShifts(dk,eid,shifts(dk,eid).filter((_,i)=>i!==idx));renderPlanning();}
function createFirst(eid,dk){const emp=S.emps.find(e=>e.id===eid);setShifts(dk,eid,[{s:11*60+30,e:17*60+30,poste:mainP(emp||{})}]);renderPlanning();}

// ═══════════════════════════════════
// DRAG & DROP
// ═══════════════════════════════════
function initDrag(){
  document.addEventListener('mousedown',pDown,true);
  document.addEventListener('touchstart',pDown,{capture:true,passive:false});
  document.addEventListener('mousemove',pMove,true);
  document.addEventListener('touchmove',pMove,{capture:true,passive:false});
  document.addEventListener('mouseup',pUp,true);
  document.addEventListener('touchend',pUp,{capture:true,passive:false});
}
function coord(e){
  if(e.touches&&e.touches.length)return{x:e.touches[0].clientX,y:e.touches[0].clientY};
  if(e.changedTouches&&e.changedTouches.length)return{x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY};
  return{x:e.clientX,y:e.clientY};
}
function pDown(e){
  const{x,y}=coord(e),el=document.elementFromPoint(x,y);if(!el)return;
  if(el.closest('[data-role="del"]')){e.stopPropagation();e.preventDefault();const b=el.closest('[data-blk]');if(b)delShift(b.dataset.eid,b.dataset.dk,+b.dataset.idx);return;}
  if(el.closest('[data-role="poste"]')){e.stopPropagation();DRAG={type:'poste',x0:x,y0:y,el};return;}
  const lh=el.closest('[data-role="left"]'),rh=el.closest('[data-role="right"]'),mv=el.closest('[data-role="move"]');
  const handle=lh||rh||mv;
  if(handle){const b=handle.closest('[data-blk]');if(!b)return;const sh=shifts(b.dataset.dk,b.dataset.eid)[+b.dataset.idx];if(!sh)return;
    e.stopPropagation();e.preventDefault();
    DRAG={type:lh?'left':rh?'right':'move',eid:b.dataset.eid,dk:b.dataset.dk,idx:+b.dataset.idx,x0:x,oS:sh.s,oE:sh.e,cs:sh.s,ce:sh.e,moved:false};
    document.body.style.cursor=mv?'grabbing':'ew-resize';return;
  }
  const tr=el.closest('.track[data-eid]');
  if(tr&&!el.closest('[data-blk]'))DRAG={type:'click',eid:tr.dataset.eid,dk:tr.dataset.dk,track:tr,x0:x,y0:y};
}
function pMove(e){
  if(!DRAG)return;
  if(DRAG.type==='click'){const{x,y}=coord(e);if(Math.abs(x-DRAG.x0)>6||Math.abs(y-DRAG.y0)>6)DRAG=null;return;}
  if(DRAG.type==='poste')return;
  if(e.cancelable)e.preventDefault();e.stopPropagation();
  const{x}=coord(e),dm=(x-DRAG.x0)/PX,dur=DRAG.oE-DRAG.oS;
  let ns=DRAG.oS,ne=DRAG.oE;
  if(DRAG.type==='move'){ns=snap(clamp(DRAG.oS+dm,TL_S,TL_E-dur));ne=ns+dur;}
  else if(DRAG.type==='left'){ns=snap(clamp(DRAG.oS+dm,TL_S,DRAG.oE-MIN_D));}
  else if(DRAG.type==='right'){ne=snap(clamp(DRAG.oE+dm,DRAG.oS+MIN_D,TL_E));}
  DRAG.cs=ns;DRAG.ce=ne;DRAG.moved=true;
  const b=document.getElementById('blk-'+DRAG.eid+'-'+DRAG.idx);
  if(b){b.style.left=m2px(ns)+'px';b.style.width=(m2px(ne)-m2px(ns))+'px';
    const bt=b.querySelector('[data-t="bt"]');if(bt)bt.textContent=fT(ns)+'–'+fT(ne);
    const bd=b.querySelector('[data-t="bd"]');if(bd)bd.textContent=fDur(ne-ns);}
}
function pUp(e){
  if(!DRAG)return;
  const{x,y}=coord(e),d=DRAG;DRAG=null;document.body.style.cursor='';
  if(d.type==='poste'){if(Math.abs(x-d.x0)<8&&Math.abs(y-d.y0)<8){const b=d.el.closest('[data-blk]');if(b)showPostePicker(b.dataset.eid,b.dataset.dk,+b.dataset.idx,d.el);}return;}
  if(d.type==='click'){if(Math.abs(x-d.x0)<8&&Math.abs(y-d.y0)<8){const rect=d.track.getBoundingClientRect(),cm=snap(clamp(px2m(x-rect.left),TL_S,TL_E-MIN_D));const emp=S.emps.find(e=>e.id===d.eid);setShifts(d.dk,d.eid,[...shifts(d.dk,d.eid),{s:cm,e:Math.min(cm+MIN_D,TL_E),poste:mainP(emp||{})}]);renderPlanning();}return;}
  if(d.moved){const arr=shifts(d.dk,d.eid);if(arr[d.idx]){arr[d.idx].s=d.cs;arr[d.idx].e=d.ce;setShifts(d.dk,d.eid,arr);renderPlanning();}}
}

// ═══════════════════════════════════
// TIMELINE
// ═══════════════════════════════════
function buildTimeline(dk){
  const PS_=getPS(),grp={};
  getPostes().forEach(p=>{grp[p.id]=[];});
  S.emps.forEach(e=>(grp[mainP(e)]||grp[getPostes()[0].id]).push(e));
  const hrs=Array.from({length:19},(_,i)=>i+6);
  const sph=hrs.map(h=>S.emps.filter(e=>shifts(dk,e.id).some(sh=>sh.s<=h*60&&sh.e>h*60)).length);
  const peak=Math.max(...sph,1);
  const ticks=hrs.map((h,i)=>{
    const maj=h%4===0,c=sph[i],pct=c/peak;
    const bc=c===0?'transparent':c===peak?'#0EA5E9':pct>=.7?'#38BDF8':pct>=.4?'#7DD3FC':'#BAE6FD';
    const bh=c?Math.max(3,Math.round(pct*14)):0;
    return`<div style="position:absolute;left:${m2px(h*60)}px;top:0;bottom:0;pointer-events:none;width:${m2px((h+1)*60)-m2px(h*60)}px">
      <span style="position:absolute;top:0;left:3px;font-size:${maj?10:9}px;color:${maj?'#475569':'#94A3B8'};font-weight:${maj?600:400};line-height:20px;white-space:nowrap">${h<24?h+'h':'0h'}</span>
      <div style="position:absolute;top:20px;left:0;bottom:0;width:1px;background:${maj?'#CBD5E1':'#E2E8F0'}"></div>
      <div style="position:absolute;bottom:0;left:1px;right:0;height:${bh}px;background:${bc};border-radius:2px 2px 0 0"></div>
      ${c?`<span style="position:absolute;bottom:${bh+1}px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:${c===peak?'#0284C7':'#64748B'};line-height:1">${c}</span>`:''}
    </div>`;}).join('');
  const now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const nowLine=iso(now)===dk&&nm>=TL_S&&nm<=TL_E?`<div style="position:absolute;left:${m2px(nm)}px;top:0;bottom:0;width:2px;background:#EF4444;z-index:4;pointer-events:none"><div style="position:absolute;top:3px;left:-4px;width:10px;height:10px;border-radius:50%;background:#EF4444"></div></div>`:'';
  let rows='';
  if(!S.emps.length){
    rows=`<div style="text-align:center;padding:40px;color:#94A3B8"><div style="font-size:32px;margin-bottom:8px">👥</div><div style="font-weight:600">Aucun employé — ajoutez-en dans l'onglet Équipe</div></div>`;
  }else{
    let gi=0;
    getPostes().forEach(poste=>{
      const pe=grp[poste.id]||[];if(!pe.length)return;
      const ps=PS_[poste.id]||{};
      rows+=`<div class="sec-hdr" style="border-color:${ps.bd||'#E2E8F0'}">
        <div class="sec-lbl" style="width:${EC_W}px;color:${ps.tx||'#374151'};border-color:${ps.bd||'#E2E8F0'};background:${ps.bg||'#F8FAFC'}">
          <span style="width:7px;height:7px;border-radius:50%;background:${ps.dot||'#94A3B8'};flex-shrink:0;display:inline-block"></span>${poste.ico||''} ${poste.id}
        </div>
        <div style="flex:1;background:${ps.bg||'#F8FAFC'}"></div>
      </div>`;
      pe.forEach(emp=>{
        const shs=shifts(dk,emp.id),rh=rowH(shs.length),wh=Math.round(wkH(emp.id)*10)/10,dm=dayMin(dk,emp.id);
        const over=wh>emp.heures,under=wh>0&&wh<emp.heures*.85,z=gi%2?'#F7FAFF':'#fff';gi++;
        const addBtn=shs.length
          ?`<button onclick="addShift('${emp.id}','${dk}')" style="width:22px;height:22px;border-radius:50%;border:1px solid #86EFAC;background:#F0FDF4;color:#16A34A;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0">＋</button>`
          :`<button onclick="createFirst('${emp.id}','${dk}')" style="width:22px;height:22px;border-radius:50%;border:1px solid #BAE6FD;background:#EFF6FF;color:#0369A1;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0">＋</button>`;
        rows+=`<div style="display:flex;height:${rh}px;border-bottom:1px solid #F1F5F9">
          <div style="width:${EC_W}px;flex-shrink:0;height:${rh}px;padding:6px 8px;position:sticky;left:0;background:${z};z-index:5;border-right:1px solid #F1F5F9;display:flex;align-items:center;gap:5px">
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:12px;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${emp.prenom} ${emp.nom}</div>
              <div style="font-size:10px;color:${over?'#DC2626':under?'#D97706':'#94A3B8'}">${wh}h/${emp.heures}h</div>

            </div>${addBtn}

            style="position:relative;width:${TL_W}px;height:${rh}px;flex-shrink:0;background-color:${z};
              background-image:repeating-linear-gradient(90deg,transparent 0,transparent 119px,rgba(0,0,0,.04) 119px,rgba(0,0,0,.04) 120px);
              cursor:crosshair;touch-action:none">
            ${nowLine}${buildBlocks(emp,shs,dk)}

      });
    });
  }
  return`<div class="tl-outer">
    <div id="tl-top" style="overflow-x:auto;overflow-y:hidden;height:14px;border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:20;background:#F8FAFC" onscroll="syncScroll('top')">

        <div style="display:flex;border-bottom:2px solid #E2E8F0;background:#F8FAFC;position:sticky;top:14px;z-index:10">
          <div style="width:${EC_W}px;flex-shrink:0;padding:5px 10px;font-size:11px;font-weight:600;color:#64748B;position:sticky;left:0;background:#F8FAFC;z-index:11;border-right:1px solid #E2E8F0;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:4px">
            <div>Employé</div><div style="font-size:9px;color:#94A3B8;font-weight:500">équipiers/h →</div>
          </div>
          <div style="position:relative;width:${TL_W}px;height:46px;flex-shrink:0">${ticks}</div>
        </div>
        ${rows}
      </div>
    </div>
    <div style="padding:5px 12px;border-top:1px solid #F1F5F9;font-size:10px;color:#94A3B8;background:#F8FAFC;display:flex;gap:10px">
      <span>Barre en haut ↔ pour scroller</span><span>⋮ Tirer les bords</span>
    </div>
  </div>`;
}

function syncScroll(src){if(_scrollLock)return;_scrollLock=true;const t=document.getElementById('tl-top'),m=document.getElementById('tl-main');if(t&&m){if(src==='top')m.scrollLeft=t.scrollLeft;else t.scrollLeft=m.scrollLeft;}_scrollLock=false;}

function buildBlocks(emp,shs,dk){
  const PS_=getPS();
  return shs.map((sh,idx)=>{
    const w=m2px(sh.e)-m2px(sh.s),narrow=w<110,vNarrow=w<50;
    const poste=sh.poste||mainP(emp),ps=PS_[poste]||(PS_[getPostes()[0].id]||{});
    const pc=getPostes().find(p=>p.id===poste)||getPostes()[0];
    return`<div id="blk-${emp.id}-${idx}" data-blk="1" data-eid="${emp.id}" data-dk="${dk}" data-idx="${idx}"
      style="position:absolute;left:${m2px(sh.s)}px;width:${w}px;top:${bTop(idx)}px;height:${BH}px;
             background:${ps.bg||'#EFF6FF'};border:1.5px solid ${ps.bd||'#BFDBFE'};border-radius:8px;
             display:flex;align-items:stretch;box-shadow:0 1px 5px rgba(0,0,0,.12);z-index:2;overflow:visible;min-width:20px">
      <div data-role="left" style="position:absolute;left:0;top:0;bottom:0;width:12px;cursor:ew-resize;background:${ps.bd||'#BFDBFE'};border-radius:7px 0 0 7px;display:flex;align-items:center;justify-content:center;z-index:3"><span style="font-size:8px;color:${ps.tx||'#1E40AF'};pointer-events:none;user-select:none">⋮</span></div>

        `<span data-t="bt" style="font-size:10px;font-weight:800;color:${ps.tx||'#1E40AF'};white-space:nowrap;line-height:1.3;pointer-events:none">${fT(sh.s)}–${fT(sh.e)}</span>
         ${!narrow?`<span data-t="bd" style="font-size:9px;color:${ps.tx||'#1E40AF'};opacity:.7;pointer-events:none">${fDur(sh.e-sh.s)}</span>`:''}

// TABLEAU

function renderTableau(){
  const ds=days(),f=S.fc[SEL]||{},needs=calcNeeds(f),PS_=getPS();
  const hrs=Array.from({length:19},(_,i)=>i+6);
  const activeHrs=hrs.filter(h=>S.emps.some(e=>shifts(SEL,e.id).some(sh=>sh.s<=h*60&&sh.e>h*60)));
  const dHrs=activeHrs.length?activeHrs:hrs.slice(5,17);
  function cAt(p,h){const hm=h*60;return S.emps.filter(e=>shifts(SEL,e.id).some(sh=>sh.s<=hm&&sh.e>hm&&(sh.poste||mainP(e))===p)).length;}
  function nAt(p,h){const hm=h*60;return S.emps.filter(e=>shifts(SEL,e.id).some(sh=>sh.s<=hm&&sh.e>hm&&(sh.poste||mainP(e))===p)).map(e=>e.prenom).join(', ');}
  const tph=dHrs.map(h=>S.emps.filter(e=>shifts(SEL,e.id).some(sh=>sh.s<=h*60&&sh.e>h*60)).length);
  const pkT=Math.max(...tph,1);
  const pills=ds.map(d=>{const dk=iso(d),sel=dk===SEL,we=isWE(d);
    return`<button class="pill${sel?' active':''}${!sel&&we?' we':''}" onclick="SEL='${dk}';renderTableau()"><span style="text-transform:capitalize">${fDay(d)}</span></button>`;}).join('');
  const activeP=getPostes().filter(p=>(needs[p.id]||0)>0||dHrs.some(h=>cAt(p.id,h)>0));
  document.getElementById('tab-tableau').innerHTML=`
    <div class="row" style="gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:8px">
      <div><div style="font-size:17px;font-weight:800;color:#0F172A">📊 Tableau de positionnement</div>
      <div style="font-size:12px;color:#64748B;text-transform:capitalize">${new Date(SEL+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div></div>
      <div class="row" style="gap:6px;flex-wrap:wrap">
        <button class="btn-sec" onclick="changeWeek(-1)">‹</button><button class="btn-sec" onclick="changeWeek(1)">›</button>
        <button class="btn-sec" onclick="goToday()">Auj.</button><button class="btn-pri" onclick="printTableau()">🖨️</button>
      </div>
    </div>
    <div class="pills" style="margin-bottom:8px">${pills}</div>
    <div style="overflow-x:auto;border-radius:10px;border:1px solid #E2E8F0;box-shadow:0 1px 4px rgba(0,0,0,.07);background:#fff">
    <table id="pos-table" style="border-collapse:collapse;min-width:${120+dHrs.length*50}px;width:100%">
      <thead><tr style="background:#F8FAFC;border-bottom:2px solid #E2E8F0">
        <th style="padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:#64748B;position:sticky;left:0;background:#F8FAFC;z-index:5;min-width:100px;border-right:2px solid #E2E8F0">Poste / Heure</th>
        ${dHrs.map((h,i)=>{const tot=tph[i],pct=tot/pkT,bg=tot?tot===pkT?'#0EA5E9':pct>=.7?'#38BDF8':pct>=.4?'#BAE6FD':'#E0F2FE':'transparent',tc=tot?tot===pkT?'#fff':'#0369A1':'#CBD5E1';
          return`<th style="padding:5px 2px;text-align:center;font-size:10px;font-weight:600;color:#374151;min-width:46px;border-right:1px solid #F1F5F9"><div>${h}h</div>${tot?`<div style="margin:2px auto 0;width:30px;padding:1px 3px;border-radius:8px;background:${bg};color:${tc};font-size:10px;font-weight:800">${tot}</div>`:'<div style="height:18px"></div>'}</th>`;}).join('')}
        <th style="padding:6px 8px;text-align:center;font-size:10px;font-weight:700;color:#0369A1;min-width:50px;border-left:2px solid #E2E8F0;background:#F0F9FF">Besoin</th>
      </tr></thead>
      <tbody>
        ${activeP.map((poste,pi)=>{const ps=PS_[poste.id]||{},need=needs[poste.id]||0,rc=dHrs.map(h=>cAt(poste.id,h)),pk=Math.max(...rc,0);
          return`<tr style="border-bottom:1px solid #F1F5F9;background:${pi%2?'#FAFCFF':'#fff'}">
            <td style="padding:8px 10px;position:sticky;left:0;background:${pi%2?'#FAFCFF':'#fff'};z-index:3;border-right:2px solid #E2E8F0">
              <div style="display:flex;align-items:center;gap:6px"><span style="width:9px;height:9px;border-radius:50%;background:${ps.dot||'#94A3B8'};flex-shrink:0;display:inline-block"></span><span style="font-size:12px;font-weight:700;color:${ps.tx||'#374151'}">${poste.ico||''} ${poste.id}</span></div>
            </td>
            ${dHrs.map((h,i)=>{const c=rc[i],nm=nAt(poste.id,h),bg=c&&c>=need&&need>0?'#F0FDF4':c&&c===pk&&c>0?ps.bg||'#EFF6FF':'#fff',bd=c&&c>=need&&need>0?'1px solid #86EFAC':c?`1px solid ${ps.bd||'#BFDBFE'}`:'1px solid #F1F5F9';
              return`<td title="${nm||'—'}" style="padding:3px 2px;text-align:center;border-right:1px solid #F1F5F9"><div style="margin:0 auto;width:32px;height:22px;border-radius:6px;background:${c?bg:'#F8FAFC'};border:${bd};display:flex;align-items:center;justify-content:center"><span style="font-size:${c?12:10}px;font-weight:${c?800:400};color:${c&&c>=need&&need>0?'#16A34A':c?ps.tx||'#1E40AF':'#E2E8F0'}">${c||'—'}</span></div></td>`;}).join('')}
            <td style="padding:5px 6px;text-align:center;border-left:2px solid #E2E8F0;background:${pi%2?'#EBF7FF':'#F0F9FF'}">${need?`<div style="width:32px;height:22px;border-radius:6px;background:#0EA5E9;display:flex;align-items:center;justify-content:center;margin:0 auto"><span style="font-size:12px;font-weight:800;color:#fff">${need}</span></div>`:'<span style="font-size:10px;color:#CBD5E1">—</span>'}</td>
          </tr>`;}).join('')}
        <tr style="background:#F0F9FF;border-top:2px solid #BAE6FD">
          <td style="padding:8px 10px;position:sticky;left:0;background:#F0F9FF;z-index:3;border-right:2px solid #E2E8F0;font-size:12px;font-weight:800;color:#0369A1">TOTAL</td>
          ${dHrs.map((h,i)=>{const tot=tph[i],pk=tot===pkT&&tot>0;return`<td style="padding:3px 2px;text-align:center;border-right:1px solid #BAE6FD"><div style="margin:0 auto;width:32px;height:22px;border-radius:6px;background:${tot?pk?'#0EA5E9':'#BAE6FD':'#F8FAFC'};display:flex;align-items:center;justify-content:center"><span style="font-size:12px;font-weight:800;color:${tot?pk?'#fff':'#0369A1':'#E2E8F0'}">${tot||'0'}</span></div></td>`;}).join('')}
          <td style="padding:5px 6px;text-align:center;border-left:2px solid #BAE6FD;background:#E0F2FE"><div style="width:32px;height:22px;border-radius:6px;background:#0369A1;display:flex;align-items:center;justify-content:center;margin:0 auto"><span style="font-size:12px;font-weight:800;color:#fff">${Object.values(needs).reduce((s,v)=>s+(+v||0),0)}</span></div></td>
        </tr>
      </tbody>
    </table></div>`;
}
function printTableau(){
  const tbl=document.getElementById('pos-table');if(!tbl)return;
  const d=new Date(SEL+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  doPrint(`<div class="print-page"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #0EA5E9"><div style="font-size:28px">🫙</div><div><div style="font-size:12px;font-weight:700;color:#0EA5E9">LA MARMITE BLEUE</div><div style="font-size:18px;font-weight:800">Tableau de positionnement</div><div style="font-size:12px;color:#64748B;text-transform:capitalize">${d}</div></div></div>${tbl.outerHTML}</div>`);

function renderPosition(){
  const ds=days();if(!ds.map(iso).includes(SEL))SEL=iso(ds[0]);
  const PS_=getPS(),needs=calcNeeds(S.fc[SEL]||{});
  const pills=ds.map(d=>{const dk=iso(d),sel=dk===SEL,we=isWE(d);
    return`<button class="pill${sel?' active':''}${!sel&&we?' we':''}" onclick="SEL='${dk}';renderPosition()"><span style="text-transform:capitalize">${fDay(d)}</span></button>`;}).join('');
  function empsByPoste(poste){return S.emps.filter(e=>shifts(SEL,e.id).some(sh=>(sh.poste||mainP(e))===poste));}
  function getHrs(eid,poste){const shs=shifts(SEL,eid).filter(sh=>(sh.poste||mainP(S.emps.find(e=>e.id===eid)||{}))===poste);return(shs.length?shs:shifts(SEL,eid)).map(sh=>fT(sh.s)+'–'+fT(sh.e)).join(' ');}
  function slotHtml(poste,i){const emps=empsByPoste(poste),e=emps[i],ps=PS_[poste]||{};
    return`<div style="border:1.5px solid ${ps.bd||'#E2E8F0'};border-radius:6px;padding:5px 7px;min-height:44px;background:${e?ps.bg||'#EFF6FF':'#fff'}">
      <div style="font-size:9px;font-weight:700;color:${ps.dot||'#94A3B8'};text-transform:uppercase">${i===0?'Principal':i===1?'Équipier 2':'Renfort '+(i-1)}</div>
      <div style="font-size:11px;font-weight:700;color:${e?ps.tx||'#374151':'#CBD5E1'};min-height:15px;border-bottom:1px solid ${ps.bd||'#E2E8F0'};margin-top:1px">${e?e.prenom+' '+e.nom:''}</div>
      <div style="font-size:9px;color:${ps.dot||'#94A3B8'};margin-top:2px;min-height:12px">${e?getHrs(e.id,poste):''}</div>
    </div>`;}
  function posteCard(p){const ps=PS_[p.id]||{},need=needs[p.id]||0,cnt=empsByPoste(p.id).length,slots=Math.max(2,need,cnt);

      <div style="padding:5px 9px;background:${ps.dot||'#94A3B8'};display:flex;align-items:center;gap:5px;color:#fff">
        <span style="font-size:13px">${p.ico||'📌'}</span><span style="font-size:13px;font-weight:800;flex:1">${p.id}</span>
        ${need?`<span style="font-size:9px;padding:1px 5px;border-radius:6px;background:rgba(255,255,255,.25);font-weight:700">${cnt}/${need}</span>`:''}
      </div>
      <div style="border:1.5px solid ${ps.bd||'#E2E8F0'};border-top:none;border-radius:0 0 8px 8px;padding:5px;background:#fff;display:flex;flex-direction:column;gap:4px">
        ${Array.from({length:slots},(_,i)=>slotHtml(p.id,i)).join('')}
      </div>

  const CUISINE_IDS=['Moule','Sauce','Frite','Plonge'];
  const SERVICE_IDS=['Salle','Bar','Dessert','Livraison'];
  const postes=getPostes();
  const cuisineP=postes.filter(p=>CUISINE_IDS.includes(p.id));
  const serviceP=postes.filter(p=>SERVICE_IDS.includes(p.id));
  const autresP=postes.filter(p=>!CUISINE_IDS.includes(p.id)&&!SERVICE_IDS.includes(p.id));
  const fDate=new Date(SEL+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('tab-position').innerHTML=`
    <div class="row" style="gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:8px">
      <div><div style="font-size:17px;font-weight:800;color:#0F172A">📋 Plan de positionnement</div><div style="font-size:12px;color:#64748B;text-transform:capitalize">${fDate}</div></div>
      <div class="row" style="gap:6px"><button class="btn-sec" onclick="changeWeek(-1)">‹</button><button class="btn-sec" onclick="changeWeek(1)">›</button><button class="btn-sec" onclick="goToday()">Auj.</button><button class="btn-pri" onclick="printPosition()">🖨️</button></div>
    </div>
    <div class="pills" style="margin-bottom:8px">${pills}</div>
    <div id="pos-plan" class="card" style="padding:12px">
      <div style="display:flex;align-items:stretch;gap:8px;margin-bottom:10px;padding-bottom:10px;border-bottom:2px solid #0EA5E9">
        <div style="background:linear-gradient(135deg,#0EA5E9,#0369A1);border-radius:9px;padding:10px 13px;color:#fff;min-width:100px;display:flex;flex-direction:column;justify-content:center">
          <div style="font-size:20px;margin-bottom:2px">🫙</div><div style="font-weight:800;font-size:14px;line-height:1.2">La Marmite<br>Bleue</div>
          <div style="font-size:8px;opacity:.7;margin-top:3px;text-transform:uppercase">${fDate}</div>
        </div>
        <div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
          ${[{l:'CA prévu',v:(+(S.fc[SEL]||{}).ca||0)?fNum(+(S.fc[SEL]||{}).ca)+'€':'—'},{l:'Transactions',v:getTrans(S.fc[SEL]||{})||'—'},{l:'Équipiers planifiés',v:S.emps.filter(e=>shifts(SEL,e.id).length>0).length},{l:'Shift',v:''}]

        </div>

      ${serviceP.length?`<div style="font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.8px;margin:4px 0;display:flex;align-items:center;gap:6px"><span style="flex:1;height:1px;background:#E2E8F0"></span>🍽️ Service<span style="flex:1;height:1px;background:#E2E8F0"></span></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px">${serviceP.map(posteCard).join('')}</div>`:''}
      ${autresP.length?`<div style="font-size:10px;font-weight:700;color:#94A3B8;text-transform:uppercase;letter-spacing:.8px;margin:4px 0;display:flex;align-items:center;gap:6px"><span style="flex:1;height:1px;background:#E2E8F0"></span>Autres<span style="flex:1;height:1px;background:#E2E8F0"></span></div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px">${autresP.map(posteCard).join('')}</div>`:''}
      <div style="display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:8px;padding-top:8px;border-top:1px solid #E2E8F0">
        ${['📋 Remarques service','⚠️ Points d\'attention'].map(t=>`<div style="border:1.5px solid #E2E8F0;border-radius:8px;padding:8px"><div style="font-size:11px;font-weight:700;color:#374151;margin-bottom:5px">${t}</div>${[1,2,3].map(()=>'<div style="border-bottom:1px solid #F1F5F9;height:18px;margin-bottom:3px"></div>').join('')}</div>`).join('')}
        <div style="border:1.5px solid #BAE6FD;border-radius:8px;padding:8px;background:#F0F9FF">
          <div style="font-size:11px;font-weight:700;color:#0369A1;margin-bottom:5px">👤 Responsable</div>
          <div style="font-size:9px;color:#94A3B8">Nom</div><div style="border-bottom:1px solid #BAE6FD;height:18px;margin-bottom:4px"></div>
          <div style="display:flex;gap:8px"><div style="flex:1"><div style="font-size:9px;color:#94A3B8">Date</div><div style="border-bottom:1px solid #BAE6FD;height:18px"></div></div><div style="flex:1"><div style="font-size:9px;color:#94A3B8">Shift</div><div style="border-bottom:1px solid #BAE6FD;height:18px"></div></div></div>
        </div>
      </div>
    </div>`;
}
function printPosition(){const p=document.getElementById('pos-plan');if(!p)return;doPrint(`<div class="print-page">${p.outerHTML}</div>`);}

  getPostes().forEach(p=>{grp[p.id]=[];});
  S.emps.forEach(e=>(grp[mainP(e)]||grp[getPostes()[0].id]).push(e));
  let html=`<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    <div><div style="font-size:17px;font-weight:800;color:#0F172A">👥 Équipe</div><div style="font-size:12px;color:#64748B">${S.emps.length} employé${S.emps.length!==1?'s':''}</div></div>
    <button class="btn-pri" onclick="openEmpModal()">+ Ajouter</button>

      html+=`<div style="display:flex;align-items:center;padding:9px 12px;background:#fff;border-top:${i?`1px solid ${ps.bd||'#E2E8F0'}`:'none'}">
        <div style="width:34px;height:34px;border-radius:50%;background:${ps.bg||'#F8FAFC'};border:2px solid ${ps.bd||'#E2E8F0'};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:${ps.tx||'#374151'};margin-right:9px;flex-shrink:0">${(emp.prenom?.[0]||'?').toUpperCase()}${(emp.nom?.[0]||'').toUpperCase()}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:13px;color:#0F172A">${emp.prenom} ${emp.nom}</div>

          ${ex.length?`<div style="display:flex;flex-wrap:wrap;gap:2px;margin-top:2px">${ex.map(pid=>{const psp=PS_[pid]||{};return`<span style="padding:1px 5px;border-radius:10px;font-size:9px;font-weight:600;background:${psp.bg||'#F8FAFC'};color:${psp.tx||'#374151'};border:1px solid ${psp.bd||'#E2E8F0'}">${pid}</span>`;}).join('')}</div>`:''}
        </div>
        <div style="display:flex;gap:4px">
          <button onclick='openEmpModal(${JSON.stringify(emp)})' style="background:#F1F5F9;border:none;padding:6px 9px;border-radius:7px;font-size:12px">✏️</button>
          <button onclick="delEmp('${emp.id}')" style="background:#FFF1F2;border:none;padding:6px 9px;border-radius:7px;font-size:12px;color:#BE123C">🗑️</button>
        </div>
      </div>`;});
    html+='</div>';});
  if(!any)html+=`<div style="text-align:center;padding:50px;background:#fff;border-radius:12px;color:#94A3B8;border:1px dashed #E2E8F0"><div style="font-size:44px;margin-bottom:8px">👤</div><div style="font-weight:700;font-size:14px;color:#374151;margin-bottom:3px">Aucun employé</div><div style="font-size:12px">Cliquez sur + Ajouter</div></div>`;
  document.getElementById('tab-employes').innerHTML=html;
}
let editEmp=null,mPostes=[];
function openEmpModal(emp){editEmp=emp||null;mPostes=emp?[...(emp.postes||[])]:[getPostes()[0].id];buildEmpModal(emp||{});}
function buildEmpModal(e){
  document.getElementById('modal-root').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-hdr"><span>${e.id?'✏️':'👤'}</span><span>${e.id?'Modifier':'Nouvel employé'}</span></div>
        <div class="modal-body">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><label class="fld-lbl">Prénom *</label><input class="fld-inp" id="mp" type="text" value="${e.prenom||''}"></div>
            <div><label class="fld-lbl">Nom *</label><input class="fld-inp" id="mn" type="text" value="${e.nom||''}"></div>
          </div>
          <div><label class="fld-lbl">Postes <span style="font-weight:400;color:#94A3B8">(⭐ = principal)</span></label><div id="mpl">${buildPL()}</div></div>
          <div><label class="fld-lbl">Heures / semaine</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px">
              ${[20,25,30,35].map(h=>`<button class="h-btn${(e.heures||35)===h?' sel':''}" id="hb${h}" onclick="setH(${h})">${h}h</button>`).join('')}
              <input type="number" id="mh" value="${e.heures||35}" min="1" max="48" oninput="syncH(this.value)" style="width:56px;padding:6px 8px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px;text-align:center;outline:none">
              <span style="font-size:11px;color:#94A3B8">h</span>
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button onclick="closeModal()" style="padding:9px 16px;border-radius:8px;border:1px solid #E2E8F0;background:#fff;font-size:13px">Annuler</button>
          <button onclick="saveEmp()" class="btn-pri">${e.id?'Enregistrer':'Ajouter ✓'}</button>
        </div>
      </div>
    </div>`;
}
function buildPL(){const PS_=getPS();return getPostes().map(p=>{const sel=mPostes.includes(p.id),ps=PS_[p.id]||{},idx=mPostes.indexOf(p.id);
  return`<div onclick="toggleP('${p.id}')" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:2px solid ${sel?ps.dot||'#0EA5E9':'#E2E8F0'};background:${sel?ps.bg||'#EFF6FF':'#fff'};cursor:pointer;margin-bottom:4px">
    <span style="font-size:14px">${p.ico||'📌'}</span>
    <span style="font-size:13px;font-weight:500;flex:1;color:${sel?ps.tx||'#0369A1':'#374151'}">${p.id}</span>
    ${sel&&idx===0?`<span style="font-size:11px;font-weight:700;color:${ps.tx||'#0369A1'}">⭐</span>`:''}
    <span style="font-size:14px;color:${sel?ps.dot||'#0EA5E9':'#E2E8F0'}">${sel?'✓':'○'}</span>
  </div>`;}). join('');}
function toggleP(p){const i=mPostes.indexOf(p);i>=0?mPostes.splice(i,1):mPostes.push(p);const el=document.getElementById('mpl');if(el)el.innerHTML=buildPL();}
function closeModal(){document.getElementById('modal-root').innerHTML='';}
function setH(h){document.getElementById('mh').value=h;syncH(h);}
function syncH(v){[20,25,30,35].forEach(h=>{const b=document.getElementById('hb'+h);if(b)b.classList.toggle('sel',+v===h);});}
function saveEmp(){
  const prenom=(document.getElementById('mp').value||'').trim(),nom=(document.getElementById('mn').value||'').trim();
  if(!prenom||!nom){alert('Prénom et Nom requis.');return;}
  if(!mPostes.length){alert('Sélectionnez au moins un poste.');return;}
  const heures=+document.getElementById('mh').value||35,id=editEmp?.id||uid();
  const emp={id,prenom,nom,postes:[...mPostes],heures,actif:true};
  S.emps=editEmp?.id?S.emps.map(e=>e.id===id?emp:e):[...S.emps,emp];
  autoSave();closeModal();renderEmployes();
}
function delEmp(id){if(!confirm('Supprimer cet employé ?'))return;S.emps=S.emps.filter(e=>e.id!==id);autoSave();renderEmployes();}

// ═══════════════════════════════════
// EXPORT
// ═══════════════════════════════════
function renderExport(){
  const ds=days(),PS_=getPS();
  if(!S.emps.length){document.getElementById('tab-export').innerHTML=`<div style="text-align:center;padding:50px;color:#94A3B8"><div style="font-size:38px;margin-bottom:8px">📄</div><div style="font-weight:600;font-size:14px;color:#374151">Aucun employé</div></div>`;return;}
  let html=`<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px">
    <div><div style="font-size:17px;font-weight:800;color:#0F172A">📄 Export Planning</div><div style="font-size:12px;color:#64748B">${fWk(MON)}</div></div>
    <div class="row" style="gap:6px;flex-wrap:wrap">
      <button class="btn-sec" onclick="changeWeek(-1)">‹</button><button class="btn-sec" onclick="changeWeek(1)">›</button>
      <button class="btn-pri" onclick="printAll()">🖨️ Tout</button>
    </div>
  </div>`;
  S.emps.forEach(emp=>{
    const totMin=ds.reduce((s,d)=>s+dayMin(iso(d),emp.id),0),totH=Math.round(totMin/60*10)/10,ps=PS_[mainP(emp)]||{};
    html+=`<div class="card" style="margin-bottom:12px;overflow:hidden">
      <div style="padding:9px 12px;background:${ps.bg||'#F8FAFC'};display:flex;align-items:center;gap:9px;border-bottom:1px solid ${ps.bd||'#E2E8F0'}">
        <div style="width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid ${ps.bd||'#E2E8F0'};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:${ps.tx||'#374151'};flex-shrink:0">${(emp.prenom?.[0]||'?').toUpperCase()}${(emp.nom?.[0]||'').toUpperCase()}</div>
        <div style="flex:1"><div style="font-weight:700;font-size:14px;color:#0F172A">${emp.prenom} ${emp.nom}</div><div style="font-size:11px;color:#64748B">${mainP(emp)} · ${emp.heures}h contrat</div></div>
        <div style="font-weight:800;font-size:16px;color:${totH>emp.heures?'#DC2626':totH===0?'#94A3B8':'#16A34A'}">${totH}h</div>
        <button onclick="printOne('${emp.id}')" style="background:#fff;border:1px solid ${ps.bd||'#E2E8F0'};padding:5px 9px;border-radius:7px;font-size:11px;color:${ps.tx||'#374151'};font-weight:600">🖨️</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr)">
        ${ds.map(d=>{const dk=iso(d),shs=shifts(dk,emp.id),we=isWE(d);
          return`<div style="padding:6px 4px;border-right:1px solid #F1F5F9;min-height:65px;background:${we?'#FAFAFA':'#fff'}">
            <div style="font-size:9px;font-weight:600;color:${we?'#DC2626':'#64748B'};text-transform:capitalize;margin-bottom:3px;text-align:center">${fDay(d)}</div>
            ${shs.length?shs.map(sh=>{const p=sh.poste||mainP(emp),psp=PS_[p]||ps;return`<div style="text-align:center;margin-bottom:2px;padding:3px;border-radius:5px;background:${psp.bg||'#EFF6FF'};border:1px solid ${psp.bd||'#BFDBFE'}"><div style="font-size:10px;font-weight:800;color:#0369A1">${fT(sh.s)}–${fT(sh.e)}</div><div style="font-size:8px;color:#64748B">${fDur(sh.e-sh.s)}</div><div style="font-size:8px;font-weight:700;color:${psp.tx||'#1E40AF'}">${p}</div></div>`;}).join(''):`<div style="font-size:10px;color:#CBD5E1;text-align:center;padding-top:6px">Repos</div>`}
          </div>`;}).join('')}
      </div>
    </div>`;
  });
  document.getElementById('tab-export').innerHTML=html;
}
function buildPrintEmp(emp){
  const ds=days(),PS_=getPS(),totH=Math.round(ds.reduce((s,d)=>s+dayMin(iso(d),emp.id),0)/60*10)/10,ps=PS_[mainP(emp)]||{};
  return`<div class="print-page"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #0EA5E9">
    <div style="font-size:28px">🫙</div><div style="flex:1"><div style="font-size:12px;font-weight:700;color:#0EA5E9">LA MARMITE BLEUE</div><div style="font-size:18px;font-weight:800;color:#0F172A">${emp.prenom} ${emp.nom}</div><div style="font-size:12px;color:#64748B">${mainP(emp)} · ${fWk(MON)}</div></div>
    <div style="text-align:right"><div style="font-size:10px;color:#64748B">Contrat</div><div style="font-size:16px;font-weight:800">${emp.heures}h/sem</div></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">
    ${ds.map(d=>{const dk=iso(d),shs=shifts(dk,emp.id),we=isWE(d);return`<div style="border:1px solid #E2E8F0;border-radius:5px;padding:7px 5px;min-height:85px;background:${we?'#FAFAFA':'#fff'}"><div style="font-size:10px;font-weight:700;color:${we?'#DC2626':'#374151'};text-align:center;margin-bottom:3px;text-transform:capitalize">${fDay(d)}</div>${shs.length?shs.map(sh=>{const p=sh.poste||mainP(emp),psp=PS_[p]||ps;return`<div style="margin-bottom:3px;padding:4px;border-radius:4px;background:${psp.bg||'#EFF6FF'};text-align:center"><div style="font-size:12px;font-weight:800;color:#0369A1">${fT(sh.s)}–${fT(sh.e)}</div><div style="font-size:9px;color:#64748B">${fDur(sh.e-sh.s)}</div><div style="font-size:8px;font-weight:700;color:${psp.tx||'#1E40AF'}">${p}</div></div>`;}).join(''):`<div style="font-size:10px;color:#CBD5E1;text-align:center;padding-top:6px">Repos</div>`}</div>`;}).join('')}
  </div>
  <div style="margin-top:10px;padding:7px 10px;background:#F0F9FF;border-radius:6px;font-size:12px;color:#0369A1;font-weight:600">Total : <strong>${totH}h</strong>${totH>emp.heures?` ⚠️ Dépassement ${Math.round((totH-emp.heures)*10)/10}h`:''}</div>
  <div style="margin-top:16px;display:flex;justify-content:space-between"><div style="border-top:1px solid #374151;padding-top:5px;font-size:10px;color:#64748B;width:44%">Signature employé :</div><div style="border-top:1px solid #374151;padding-top:5px;font-size:10px;color:#64748B;width:44%">Signature employeur :</div></div>
  </div>`;
}
function printOne(eid){const emp=S.emps.find(e=>e.id===eid);if(!emp)return;doPrint(buildPrintEmp(emp));}
function printAll(){doPrint(S.emps.map(buildPrintEmp).join(''));}

// ═══════════════════════════════════
// PARAMS
// ═══════════════════════════════════
function renderParams(){
  const p=S.par;
  document.getElementById('tab-params').innerHTML=`<div style="max-width:520px">
    <div class="card" style="padding:16px;margin-bottom:10px">
      <div style="font-size:15px;font-weight:800;color:#0F172A;margin-bottom:3px">⚙️ Ratios de planification</div>
      <div style="font-size:11px;color:#94A3B8;margin-bottom:12px">Basé sur les transactions (CA ÷ ticket moyen).</div>
      ${[
        {k:'ticketMoyen',l:'Ticket moyen par défaut',u:'€'},
        {k:'ratioMoule', l:'1 Moule pour',           u:'transactions'},
        {k:'ratioSalle', l:'1 Salle pour',           u:'transactions'},
        {k:'ratioFrite', l:'1 Frite/Sauce pour',     u:'transactions'},
        {k:'seuilPlo',   l:'Plonge à partir de',     u:'transactions'},
        {k:'seuilBar',   l:'Bar à partir de',        u:'€ CA'},
      ].map(({k,l,u})=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid #F1F5F9;background:#FAFAFA;margin-bottom:5px">
        <div style="flex:1"><div style="font-size:12px;font-weight:500;color:#374151">${l}</div><div style="font-size:10px;color:#94A3B8">${u}</div></div>
        <input type="number" value="${p[k]||0}" min="1" id="pr-${k}" style="width:66px;padding:5px 7px;border:1px solid #E2E8F0;border-radius:7px;font-size:14px;font-weight:700;text-align:center;color:#0F172A;outline:none">
      </div>`).join('')}
      <button id="spb" class="btn-pri" onclick="saveParams()" style="width:100%;padding:10px;font-size:14px;border-radius:9px;margin-top:4px">💾 Enregistrer</button>
    </div>
    <div class="card" style="padding:14px;margin-bottom:10px">
      <div style="font-size:15px;font-weight:800;color:#0F172A;margin-bottom:3px">🏷️ Gestion des postes</div>
      <div style="font-size:11px;color:#94A3B8;margin-bottom:12px">Créez vos postes — ils apparaissent dans les menus déroulants des créneaux.</div>
      <div id="postes-list">${buildPostesList()}</div>
      <button onclick="openPosteModal(null)" style="width:100%;margin-top:8px;padding:10px;border-radius:9px;background:#F0F9FF;border:2px dashed #BAE6FD;color:#0369A1;font-size:13px;font-weight:700;cursor:pointer">＋ Ajouter un poste</button>
    </div>
    <div class="card" style="padding:14px">
      <div style="font-size:13px;font-weight:700;color:#0F172A;margin-bottom:7px">🔥 Firebase</div>
      <div style="font-size:12px;color:#64748B;margin-bottom:2px">Projet : <strong>pointagemarmitebleue</strong></div>
      <div style="font-size:12px;color:#64748B;margin-bottom:10px">Collection : <strong>marmite-planning / state</strong></div>
      <button onclick="dbSave()" class="btn-sec" style="width:100%;padding:9px;border-radius:8px;font-size:13px">🔄 Forcer la synchronisation</button>
    </div>
  </div>`;
}
function saveParams(){
  ['ratioMoule','ratioSalle','ratioFrite','seuilPlo','seuilBar','ticketMoyen'].forEach(k=>{const el=document.getElementById('pr-'+k);if(el)S.par[k]=+el.value||0;});
  autoSave();
  const b=document.getElementById('spb');if(b){b.textContent='✓ Enregistré';b.style.background='#16A34A';setTimeout(()=>{b.textContent='💾 Enregistrer';b.style.background='';},2000);}
}
function buildPostesList(){
  const PS_=getPS();
  return getPostes().map((p,i)=>{const ps=PS_[p.id]||{},col=COLOR_PALETTE.find(c=>c.key===p.color)||COLOR_PALETTE[0];
    return`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid ${ps.bd||'#E2E8F0'};background:${ps.bg||'#fff'};margin-bottom:5px">
      <span style="font-size:16px">${p.ico||'📌'}</span>
      <div style="flex:1"><div style="font-size:13px;font-weight:700;color:${ps.tx||'#374151'}">${p.id}</div><div style="font-size:10px;color:${ps.dot||'#94A3B8'}">${col.label}</div></div>
      <div style="display:flex;gap:4px">
        ${i>0?`<button onclick="movePoste(${i},-1)" style="background:#F1F5F9;border:none;padding:5px 8px;border-radius:6px;font-size:12px;cursor:pointer">↑</button>`:'<span style="width:30px"></span>'}
        ${i<getPostes().length-1?`<button onclick="movePoste(${i},1)" style="background:#F1F5F9;border:none;padding:5px 8px;border-radius:6px;font-size:12px;cursor:pointer">↓</button>`:'<span style="width:30px"></span>'}
        <button onclick="openPosteModal(${i})" style="background:#F1F5F9;border:none;padding:5px 8px;border-radius:6px;font-size:13px;cursor:pointer">✏️</button>
        ${getPostes().length>1?`<button onclick="delPoste(${i})" style="background:#FFF1F2;border:none;padding:5px 8px;border-radius:6px;font-size:13px;color:#BE123C;cursor:pointer">🗑️</button>`:''}
      </div>
    </div>`;}).join('');
}
function movePoste(i,dir){const p=[...getPostes()],j=i+dir;if(j<0||j>=p.length)return;[p[i],p[j]]=[p[j],p[i]];S.postesConfig=p;autoSave();const el=document.getElementById('postes-list');if(el)el.innerHTML=buildPostesList();}
function delPoste(i){const p=getPostes();if(p.length<=1){alert('Il faut au moins un poste.');return;}if(!confirm(`Supprimer "${p[i].id}" ?`))return;S.postesConfig=p.filter((_,idx)=>idx!==i);autoSave();const el=document.getElementById('postes-list');if(el)el.innerHTML=buildPostesList();}
let editPosteIdx=null;
function openPosteModal(i){
  editPosteIdx=i;
  const p=(i!=null)?getPostes()[i]:{id:'',ico:'📌',color:'blue'};
  window._selColor=p.color||'blue';
  document.getElementById('modal-root').innerHTML=`
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-hdr"><span>🏷️</span><span>${i!=null?'Modifier le poste':'Nouveau poste'}</span></div>
        <div class="modal-body">
          <div style="display:grid;grid-template-columns:80px 1fr;gap:10px">
            <div><label class="fld-lbl">Icône</label><input class="fld-inp" id="p-ico" type="text" value="${p.ico||'📌'}" style="font-size:20px;text-align:center"></div>
            <div><label class="fld-lbl">Nom *</label><input class="fld-inp" id="p-nom" type="text" value="${i!=null?p.id:''}" placeholder="ex: Caisse, Runner…"></div>
          </div>
          <div><label class="fld-lbl">Couleur</label>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px">
              ${COLOR_PALETTE.map(c=>`<div onclick="selColor('${c.key}')" id="col-${c.key}" style="padding:8px 6px;border-radius:8px;border:2px solid ${c.key===p.color?c.dot:'#E2E8F0'};background:${c.bg};cursor:pointer;text-align:center;transition:border-color .1s">
                <div style="width:16px;height:16px;border-radius:50%;background:${c.dot};margin:0 auto 3px"></div>
                <div style="font-size:10px;font-weight:600;color:${c.tx}">${c.label}</div>
              </div>`).join('')}
            </div>
          </div>
        </div>
        <div class="modal-foot">
          <button onclick="closeModal()" style="padding:9px 16px;border-radius:8px;border:1px solid #E2E8F0;background:#fff;font-size:13px">Annuler</button>
          <button onclick="savePoste()" class="btn-pri">${i!=null?'Enregistrer':'Ajouter ✓'}</button>
        </div>
      </div>
    </div>`;
}
function selColor(key){
  window._selColor=key;
  document.querySelectorAll('[id^="col-"]').forEach(el=>{const k=el.id.replace('col-',''),c=COLOR_PALETTE.find(x=>x.key===k);if(c)el.style.borderColor=k===key?c.dot:'#E2E8F0';});
}
function savePoste(){
  const nom=(document.getElementById('p-nom').value||'').trim(),ico=(document.getElementById('p-ico').value||'📌').trim();
  if(!nom){alert('Le nom est requis.');return;}
  const color=window._selColor||'blue',postes=[...getPostes()];
  if(editPosteIdx!=null){postes[editPosteIdx]={...postes[editPosteIdx],id:nom,ico,color};}
  else{if(postes.find(p=>p.id===nom)){alert('Ce poste existe déjà.');return;}postes.push({id:nom,ico,color});}
  S.postesConfig=postes;autoSave();closeModal();
  const el=document.getElementById('postes-list');if(el)el.innerHTML=buildPostesList();
  if(curTab==='planning')renderPlanning();
}

// ═══════════════════════════════════
// PRINT
// ═══════════════════════════════════
function doPrint(html){
  const a=document.getElementById('print-area');
  a.innerHTML=html;a.style.display='block';
  document.getElementById('app').style.display='none';
  window.print();
  a.style.display='none';document.getElementById('app').style.display='flex';a.innerHTML='';
}

// ═══════════════════════════════════
// GO
// ═══════════════════════════════════
init();
</script>
</body>
</html>
